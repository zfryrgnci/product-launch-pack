<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Neon Blocks</title>
  <style>
    * { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
    html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden;
      font-family: Arial, Helvetica, sans-serif; touch-action: none; }
    #game-wrapper {
      position: absolute; inset: 0; margin: auto;
      width: min(100vw, 62.5vh); height: min(160vw, 100vh);
      max-width: 100vw; max-height: 100vh;
      background: #0a0a14; overflow: hidden;
      box-shadow: 0 0 30px rgba(69, 240, 255, 0.5);
      border: 3px solid #45f0ff;
      box-sizing: border-box;
    }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #ui { position: absolute; top: 8px; left: 12px; right: 12px; color: #45f0ff; font-size: 15px; font-weight: bold;
      text-shadow: 0 0 6px #45f0ff; pointer-events: none; z-index: 5;
      display: flex; justify-content: space-between; }
    #ui .crown { color: #ffd23f; text-shadow: 0 0 6px #ffd23f; }
    #ad-overlay { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.92);
      z-index: 100; flex-direction: column; justify-content: center; align-items: center;
      color: #fff; text-align: center; padding: 20px; box-sizing: border-box; }
    #overlay-title { color: #45f0ff; margin: 0 0 10px; font-size: 32px; font-weight: 900; letter-spacing: 2px;
      text-shadow: 0 0 12px #45f0ff; }
    #overlay-stats { color: #ffd23f; font-size: 15px; margin-bottom: 16px; line-height: 1.7; }
    .ov-btn { padding: 13px 26px; margin: 7px; font-size: 18px; font-family: inherit; font-weight: 800;
      background: transparent; color: #0ff; border: 2px solid #0ff; border-radius: 28px; cursor: pointer;
      letter-spacing: 2px; }
    .ov-btn:active { background: #0ff; color: #000; }
    #revive-btn { color: #ffcc00; border-color: #ffcc00; }
    #remove-ads-btn { color: #f0f; border-color: #f0f; font-size: 13px; padding: 8px 16px; }
    #mute-btn { color: #888; border-color: #888; font-size: 12px; padding: 6px 12px; }
    #menu-btn2 { color: #8ff; border-color: #8ff; font-size: 13px; padding: 8px 16px; }
    /* ---- Title menu ---- */
    #menu { position: absolute; inset: 0; background: #0a0a14; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; box-sizing: border-box; }
    #menu h1 { font-size: 52px; font-weight: 900; letter-spacing: 5px; text-align: center;
      color: transparent; -webkit-text-stroke: 2px #45f0ff; line-height: 1.05; margin: 0 0 10px;
      text-shadow: 0 0 26px rgba(69,240,255,0.9), 0 0 70px rgba(255,0,150,0.5); }
    #menu .tag { color: #ffd23f; font-size: 14px; letter-spacing: 3px; margin-bottom: 30px; font-weight: 700; }
    #play-btn { width: 100%; max-width: 300px; padding: 18px 0; border: none; border-radius: 40px;
      background: #45f0ff; color: #001; font-size: 22px; font-weight: 900; letter-spacing: 4px;
      font-family: inherit; box-shadow: 0 0 34px rgba(69,240,255,0.85); cursor: pointer; }
    #play-btn:active { transform: scale(0.97); }
    #menu-best { color: #8ff; font-size: 14px; margin-top: 26px; letter-spacing: 1px; line-height: 1.9; text-align: center; }
    #menu-best b { color: #ffd23f; font-size: 18px; }
    #menu-mute { margin-top: 22px; padding: 10px 28px; background: transparent; color: #99a;
      border: 1px solid #99a; border-radius: 24px; font-size: 13px; letter-spacing: 2px; font-weight: 700;
      font-family: inherit; cursor: pointer; }
    /* mini block decoration */
    .deco { display: flex; gap: 6px; margin-bottom: 26px; }
    .deco i { width: 26px; height: 26px; border-radius: 5px; display: block; }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
      <span>SCORE <span id="score">0</span></span>
      <span class="crown">&#9813; <span id="best">0</span></span>
    </div>
    <div id="ad-overlay">
      <h1 id="overlay-title">GAME OVER</h1>
      <div id="overlay-stats"></div>
      <button class="ov-btn" id="revive-btn" style="display:none;">&#9654; CLEAR THE BOARD (AD)</button>
      <button class="ov-btn" id="restart-btn">PLAY AGAIN</button>
      <button class="ov-btn" id="menu-btn2">MAIN MENU</button>
      <button class="ov-btn" id="remove-ads-btn">REMOVE ADS</button>
    </div>
    <div id="menu">
      <h1>NEON<br>BLOCKS</h1>
      <div class="tag">DRAG &#8226; FILL &#8226; BLAST</div>
      <div class="deco">
        <i style="background:#45f0ff;box-shadow:0 0 12px #45f0ff"></i>
        <i style="background:#ff3f8e;box-shadow:0 0 12px #ff3f8e"></i>
        <i style="background:#ffd23f;box-shadow:0 0 12px #ffd23f"></i>
        <i style="background:#7dff5a;box-shadow:0 0 12px #7dff5a"></i>
        <i style="background:#b45aff;box-shadow:0 0 12px #b45aff"></i>
      </div>
      <button id="play-btn">PLAY</button>
      <div id="menu-best">BEST SCORE<br><b id="menu-best-v">0</b></div>
      <button id="menu-mute">SOUND: ON</button>
    </div>
  </div>
  <script src="core.js"></script>
  <script src="game.js"></script>
</body>
</html>
