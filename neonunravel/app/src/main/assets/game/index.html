    tone(1318, 0.30, 'sine', 0.08, 0.10);
  }
  function sfxFrozen() {
    tone(220, 0.14, 'sine', 0.16, 0, 150);
    noise(0.10, 0.09, 2600);
  }
  function sfxCombo(n) {
    var base = 659.25 * Math.pow(2, Math.min(6, n) / 12);
    tone(base, 0.18, 'triangle', 0.14);
    tone(base * 1.5, 0.22, 'sine', 0.11, 0.06);
  }
  function sfxCoin() { tone(1046, 0.10, 'square', 0.09); tone(1568, 0.14, 'square', 0.07, 0.06); }
  function sfxWin() {
    var seq = [523.25, 659.25, 783.99, 1046.5, 1318.5];
    seq.forEach(function (f, i) { tone(f, 0.4, 'triangle', 0.15, i * 0.09); });
    noise(0.5, 0.06, 3200, 0.05);
  }
  function sfxFail() {
    tone(392, 0.5, 'sawtooth', 0.11, 0, 150);
    tone(196, 0.6, 'sine', 0.10, 0.05, 90);
  }
  function sfxStar(i) { tone(880 * Math.pow(2, i / 12), 0.28, 'sine', 0.17, 0); }

  // =====================================================================
  // App state
  // =====================================================================

  var canvas, ctx, dpr = 1;
  var app = {
    screen: SCREEN.MENU,
    level: 1,
    game: null,
    levelData: null,
    timeLeft: 0,
    timeLimit: 0,
    elapsed: 0,
    lastT: 0,
    stars: 0,
    hintCreature: -1,
    hintUntil: 0,
    pendingReward: null,     // 'hint' | 'continue'
    winAt: 0,
    completions: 0,
    transition: 0,
    toast: null,
    boardShake: 0,
    winDelay: 0.45,
    combo: 0,
    comboBest: 0,
    lastExitAt: 0,
    coinsEarned: 0,
    shatters: [],
    loadingLevel: 0
  };

  var layout = { cell: 40, ox: 0, oy: 0, minC: 0, minR: 0, gw: 1, gh: 1 };
  var anims = {};            // creatureId -> animation record
  var particles = [];
  var floaters = [];
  var uiButtons = [];
  var pressedId = null;
  var drag = null;

  // =====================================================================
  // Geometry
  // =====================================================================

  function computeLayout(level) {
    var minC = 1e9, minR = 1e9, maxC = -1, maxR = -1;
    var i, c, r;
    for (r = 0; r < level.rows; r++) {
      for (c = 0; c < level.cols; c++) {
        if (level.region[c + r * level.cols]) {
          if (c < minC) minC = c; if (c > maxC) maxC = c;
          if (r < minR) minR = r; if (r > maxR) maxR = r;
        }
      }
    }
    for (i = 0; i < level.holes.length; i++) {
      var h = level.holes[i];
      if (h.c < minC) minC = h.c; if (h.c > maxC) maxC = h.c;
      if (h.r < minR) minR = h.r; if (h.r > maxR) maxR = h.r;
    }
    // half a cell of breathing room around the holes
    var gw = maxC - minC + 1, gh = maxR - minR + 1;
    var cell = Math.min(BOARD_W / (gw + 0.3), BOARD_H / (gh + 0.3));
    cell = Math.floor(cell * 2) / 2;
    layout.cell = cell;
    layout.gw = gw; layout.gh = gh;
    layout.minC = minC; layout.minR = minR;
    layout.ox = BOARD_X + (BOARD_W - cell * gw) / 2 - minC * cell;
    layout.oy = BOARD_Y + (BOARD_H - cell * gh) / 2 - minR * cell;
  }

  function cx(c) { return layout.ox + c * layout.cell + layout.cell / 2; }
  function cy(r) { return layout.oy + r * layout.cell + layout.cell / 2; }
  function cellCenter(idx, cols) { var c = idx % cols; return { x: cx(c), y: cy((idx - c) / cols) }; }
  function pxToCell(x, y) {
    return { c: Math.floor((x - layout.ox) / layout.cell), r: Math.floor((y - layout.oy) / layout.cell) };
  }

  // =====================================================================
  // Level lifecycle
  // =====================================================================

  /**
   * Generating a hard level runs the full measure-and-reject loop, which can
   * take up to about a second. Paint a LOADING frame first and generate on the
   * next tick so the UI never appears frozen. Tests call startLevel() directly,
   * which stays synchronous.
   */
  function requestLevel(n) {
    app.loadingLevel = Math.max(1, n | 0);
    app.screen = SCREEN.LOADING;
    drag = null;
    render();
    window.setTimeout(function () { startLevel(app.loadingLevel); }, 24);
  }

  function startLevel(n) {
    app.level = Math.max(1, n | 0);
    app.levelData = Core.generateLevel(app.level);
    app.game = new Core.Game(app.levelData);
    computeLayout(app.levelData);
    app.timeLimit = app.levelData.timeLimit;
    app.timeLeft = app.timeLimit;
    app.elapsed = 0;
    app.stars = 0;
    app.hintCreature = -1;
    app.hintUntil = 0;
    app.screen = SCREEN.PLAY;
    app.transition = 1;
    app.boardShake = 0;
    app.winDelay = 0.45;
    app.combo = 0;
    app.comboBest = 0;
    app.lastExitAt = 0;
    app.coinsEarned = 0;
    app.shatters.length = 0;
    anims = {};
    particles.length = 0;
    floaters.length = 0;
    drag = null;
    store.current = app.level;
    saveStore();
    if (!store.adsRemoved) bridgeShowBanner(); else bridgeHideBanner();
  }

  function completeLevel() {
    app.screen = SCREEN.WIN;
    app.winAt = Date.now();
    app.stars = Core.starsFor(app.timeLeft, app.timeLimit, app.game.moves, app.levelData.parMoves);
    app.coinsEarned = Core.coinsFor(app.stars, app.level, app.comboBest);
    store.coins += app.coinsEarned;
    var key = String(app.level);
    if (!store.stars[key] || store.stars[key] < app.stars) store.stars[key] = app.stars;
    if (app.level + 1 > store.furthest) store.furthest = app.level + 1;
    saveStore();
    sfxWin();
    for (var s = 0; s < app.stars; s++) tone(880 * Math.pow(2, s * 2 / 12), 0.3, 'sine', 0.14, 0.45 + s * 0.16);
    burstConfetti();
    app.completions++;
    if (!store.adsRemoved && app.completions % 3 === 0) bridgeShowInterstitial();
  }

  function failLevel() {
    app.screen = SCREEN.FAIL;
    sfxFail();
    drag = null;
  }

  // =====================================================================
  // Particles / floaters
  // =====================================================================

  function burst(x, y, colorIdx, count) {
    var col = CREATURE_COLORS[colorIdx % CREATURE_COLORS.length];
    for (var i = 0; i < (count || 22); i++) {
      var a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 170;
      particles.push({
        x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
        life: 0.55 + Math.random() * 0.45, age: 0,
        size: 2.5 + Math.random() * 4.5,
        color: Math.random() < 0.35 ? col.hi : col.base
      });
    }
  }
  /** Ice shatter: shards fly outward from every cell of the freed creature. */
  function burstShatter(cr) {
    var cols = app.game.cols;
    for (var i = 0; i < cr.startCells.length + 2; i++) {
      var idx = cr.cells[Math.min(i, cr.cells.length - 1)];
      if (idx === undefined) break;
      var p = cellCenter(idx, cols);
      for (var k = 0; k < 7; k++) {
        var a = Math.random() * Math.PI * 2, sp = 70 + Math.random() * 190;
        particles.push({
          x: p.x, y: p.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
          life: 0.5 + Math.random() * 0.45, age: 0,
          size: 2 + Math.random() * 4.5,
          color: Math.random() < 0.5 ? '#ffffff' : PAL.iceDeep, gravity: 620
        });
      }
    }
  }

  function burstConfetti() {
    for (var i = 0; i < 90; i++) {
      var col = CREATURE_COLORS[i % CREATURE_COLORS.length];
      particles.push({
        x: W / 2 + (Math.random() - 0.5) * 240, y: 150 + Math.random() * 60,
        vx: (Math.random() - 0.5) * 260, vy: -120 - Math.random() * 200,
        life: 1.4 + Math.random() * 1.0, age: 0,
        size: 3 + Math.random() * 5,
        color: Math.random() < 0.4 ? col.hi : col.base, gravity: 460
      });
    }
  }
  function floatText(x, y, text, color) {
    floaters.push({ x: x, y: y, text: text, color: color || PAL.ink, age: 0, life: 1.1 });
  }
  function updateParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.age += dt;
      if (p.age >= p.life) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += (p.gravity || 340) * dt;
      p.vx *= 0.985;
    }
    for (var j = floaters.length - 1; j >= 0; j--) {
      var f = floaters[j];
      f.age += dt;
      if (f.age >= f.life) floaters.splice(j, 1);
      else f.y = Math.max(TOP_H + 24, f.y - 34 * dt);
    }
  }

  // =====================================================================
  // Animation of the snake bodies
  // =====================================================================

  function animFor(id) {
    if (!anims[id]) anims[id] = { t: 1, dur: 0.06, from: null, to: null, feed: false, holeIdx: -1, shake: 0, shakeDir: 0, glow: 0 };
    return anims[id];
  }

  function beginStepAnim(id, fromCells, toCells, feed, holeIdx, dur) {
    var a = animFor(id);
    a.from = fromCells.slice();
    a.to = toCells ? toCells.slice() : null;
    a.feed = !!feed;
    a.holeIdx = holeIdx === undefined ? -1 : holeIdx;
    a.t = 0;
    a.dur = dur || 0.062;
  }

  function updateAnims(dt) {
    for (var k in anims) {
      var a = anims[k];
      if (a.t < 1) { a.t = Math.min(1, a.t + dt / Math.max(0.016, a.dur)); }
      if (a.shake > 0) a.shake = Math.max(0, a.shake - dt * 3.6);
      if (a.glow > 0) a.glow = Math.max(0, a.glow - dt * 1.6);
    }
  }

  function easeOut(t) { return 1 - Math.pow(1 - t, 2.2); }

  /** Rendered polyline for a creature, in canvas pixels. */
  function renderPointsFor(cr) {
    var cols = app.game.cols;
    var a = anims[cr.id];
    var pts = [], i;
    if (!a || a.t >= 1 || !a.from) {
      for (i = 0; i < cr.cells.length; i++) pts.push(cellCenter(cr.cells[i], cols));
      return pts;
    }
    var t = easeOut(a.t);
    if (a.feed) {
      var holeC = a.holeIdx >= 0 ? cellCenter(a.holeIdx, cols) : cellCenter(a.from[0], cols);
      for (i = 0; i < a.from.length; i++) {
        var src = cellCenter(a.from[i], cols);
        var dst = (i === 0) ? holeC : cellCenter(a.from[i - 1], cols);
        pts.push({ x: src.x + (dst.x - src.x) * t, y: src.y + (dst.y - src.y) * t });
      }
      return pts;
    }
    var n = Math.max(a.from.length, a.to ? a.to.length : 0);
    for (i = 0; i < n; i++) {
      var s = cellCenter(a.from[Math.min(i, a.from.length - 1)], cols);
      var d = a.to ? cellCenter(a.to[Math.min(i, a.to.length - 1)], cols) : s;
      pts.push({ x: s.x + (d.x - s.x) * t, y: s.y + (d.y - s.y) * t });
    }
    return pts;
  }

  // =====================================================================
  // Drawing primitives
  // =====================================================================

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    r = Math.min(r, w / 2, h / 2);
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function fillRR(x, y, w, h, r, color) { rr(x, y, w, h, r); ctx.fillStyle = color; ctx.fill(); }
  function strokeRR(x, y, w, h, r, color, lw) {
    rr(x, y, w, h, r); ctx.strokeStyle = color; ctx.lineWidth = lw || 2; ctx.stroke();
  }
  function text(str, x, y, size, color, align, weight) {
    ctx.font = (weight || '800') + ' ' + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.fillStyle = color; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y);
  }

  /** Register + draw a tappable button. All buttons are >= 48 CSS px. */
  function button(id, x, y, w, h, label, opts) {
    opts = opts || {};
    uiButtons.push({ id: id, x: x, y: y, w: w, h: h, action: opts.action, enabled: opts.enabled !== false });
    var down = pressedId === id;
    var enabled = opts.enabled !== false;
    var dy = down ? 2 : 0;
    var base = opts.color || PAL.panel;
    var edge = opts.edge || PAL.panelEdge;
    // drop shadow / 3d lip
    if (enabled) { fillRR(x, y + 4, w, h, opts.radius || 16, opts.shadow || 'rgba(70,86,116,0.34)'); }
    fillRR(x, y + dy, w, h - (down ? 2 : 0), opts.radius || 16, enabled ? base : '#e6ebf3');
    strokeRR(x + 1, y + dy + 1, w - 2, h - 2 - (down ? 2 : 0), (opts.radius || 16) - 1, enabled ? edge : '#d3dbe7', 2);
    var fg = enabled ? (opts.fg || PAL.ink) : '#9fabbf';
    if (opts.icon) drawIcon(opts.icon, x + w / 2, y + dy + h / 2 - (opts.label ? 8 : 0), opts.iconSize || 22, fg);
    if (label) {
      text(label, x + w / 2, y + dy + h / 2 + (opts.icon ? 17 : 0), opts.size || 16, fg, 'center', opts.weight || '800');
    }
    if (opts.badge !== undefined && opts.badge !== null) {
      var bw = 22;
      fillRR(x + w - bw - 4, y + dy + 3, bw, 18, 9, opts.badgeColor || PAL.accent);
      text(String(opts.badge), x + w - bw / 2 - 4, y + dy + 12, 11, '#fff', 'center', '900');
    }
    return uiButtons[uiButtons.length - 1];
  }

  function drawIcon(name, x, y, s, color) {
    ctx.save();
    ctx.strokeStyle = color; ctx.fillStyle = color;
    ctx.lineWidth = Math.max(2.4, s * 0.16);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    var h = s / 2;
    if (name === 'undo') {
      ctx.beginPath();
      ctx.arc(x, y + h * 0.15, h * 0.72, Math.PI * 0.85, Math.PI * 2.25);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x - h * 0.72, y - h * 0.55);
      ctx.lineTo(x - h * 0.72, y + h * 0.16);
      ctx.lineTo(x - h * 0.05, y + h * 0.16);
      ctx.closePath(); ctx.fill();
    } else if (name === 'restart') {
      ctx.beginPath();
      ctx.arc(x, y, h * 0.72, Math.PI * 0.35, Math.PI * 1.85);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x + h * 0.62, y - h * 0.72);
      ctx.lineTo(x + h * 0.95, y + h * 0.08);
      ctx.lineTo(x + h * 0.10, y - h * 0.16);
      ctx.closePath(); ctx.fill();
    } else if (name === 'hint') {
      ctx.beginPath();
      ctx.arc(x, y - h * 0.18, h * 0.55, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x - h * 0.26, y + h * 0.42); ctx.lineTo(x + h * 0.26, y + h * 0.42);
      ctx.moveTo(x - h * 0.18, y + h * 0.75); ctx.lineTo(x + h * 0.18, y + h * 0.75);
      ctx.stroke();
    } else if (name === 'pause') {
      ctx.lineWidth = Math.max(3, s * 0.22);
      ctx.beginPath();
      ctx.moveTo(x - h * 0.34, y - h * 0.6); ctx.lineTo(x - h * 0.34, y + h * 0.6);
      ctx.moveTo(x + h * 0.34, y - h * 0.6); ctx.lineTo(x + h * 0.34, y + h * 0.6);
      ctx.stroke();
    } else if (name === 'play') {
      ctx.beginPath();
      ctx.moveTo(x - h * 0.42, y - h * 0.68);
      ctx.lineTo(x + h * 0.72, y);
      ctx.lineTo(x - h * 0.42, y + h * 0.68);
      ctx.closePath(); ctx.fill();
    } else if (name === 'sound') {
      ctx.beginPath();
      ctx.moveTo(x - h * 0.7, y - h * 0.28); ctx.lineTo(x - h * 0.3, y - h * 0.28);
      ctx.lineTo(x + h * 0.05, y - h * 0.72); ctx.lineTo(x + h * 0.05, y + h * 0.72);
      ctx.lineTo(x - h * 0.3, y + h * 0.28); ctx.lineTo(x - h * 0.7, y + h * 0.28);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.arc(x + h * 0.2, y, h * 0.42, -Math.PI / 3, Math.PI / 3); ctx.stroke();
      ctx.beginPath();
      ctx.arc(x + h * 0.2, y, h * 0.72, -Math.PI / 3, Math.PI / 3); ctx.stroke();
    } else if (name === 'mute') {
      ctx.beginPath();
      ctx.moveTo(x - h * 0.7, y - h * 0.28); ctx.lineTo(x - h * 0.3, y - h * 0.28);
      ctx.lineTo(x + h * 0.05, y - h * 0.72); ctx.lineTo(x + h * 0.05, y + h * 0.72);
      ctx.lineTo(x - h * 0.3, y + h * 0.28); ctx.lineTo(x - h * 0.7, y + h * 0.28);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x + h * 0.28, y - h * 0.36); ctx.lineTo(x + h * 0.86, y + h * 0.36);
      ctx.moveTo(x + h * 0.86, y - h * 0.36); ctx.lineTo(x + h * 0.28, y + h * 0.36);
      ctx.stroke();
    } else if (name === 'home') {
      ctx.beginPath();
      ctx.moveTo(x, y - h * 0.7); ctx.lineTo(x + h * 0.8, y);
      ctx.lineTo(x + h * 0.55, y); ctx.lineTo(x + h * 0.55, y + h * 0.7);
      ctx.lineTo(x - h * 0.55, y + h * 0.7); ctx.lineTo(x - h * 0.55, y);
      ctx.lineTo(x - h * 0.8, y);
      ctx.closePath(); ctx.fill();
    } else if (name === 'clock') {
      ctx.beginPath(); ctx.arc(x, y, h * 0.78, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, y - h * 0.42); ctx.lineTo(x, y); ctx.lineTo(x + h * 0.34, y + h * 0.2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawStar(x, y, r, filled) {
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var ang = -Math.PI / 2 + i * Math.PI / 5;
      var rad = i % 2 === 0 ? r : r * 0.46;
      var px = x + Math.cos(ang) * rad, py = y + Math.sin(ang) * rad;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = filled ? PAL.star : PAL.starOff;
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = filled ? '#c98f00' : '#a9b5c9';
    ctx.stroke();
  }

  // =====================================================================
  // Board rendering
  // =====================================================================

  function drawBoard() {
    var lv = app.levelData, g = app.game;
    var cell = layout.cell, cols = lv.cols;
    var c, r, i;

    ctx.save();
    if (app.boardShake > 0) {
      ctx.translate((Math.random() - 0.5) * app.boardShake, (Math.random() - 0.5) * app.boardShake);
    }

    // --- soft drop shadow behind the whole playable region
    ctx.save();
    ctx.shadowColor = PAL.boardShadow;
    ctx.shadowBlur = 16; ctx.shadowOffsetY = 6;
    ctx.fillStyle = PAL.boardCell;
    for (r = 0; r < lv.rows; r++) {
      for (c = 0; c < lv.cols; c++) {
        if (!lv.region[c + r * cols]) continue;
        ctx.fillRect(layout.ox + c * cell, layout.oy + r * cell, cell + 0.6, cell + 0.6);
      }
    }
    ctx.restore();

    // --- cells with a subtle checker so the grid reads clearly
    for (r = 0; r < lv.rows; r++) {
      for (c = 0; c < lv.cols; c++) {
        i = c + r * cols;
        if (!lv.region[i]) continue;
        ctx.fillStyle = ((c + r) & 1) ? PAL.boardCell : PAL.boardCellAlt;
        ctx.fillRect(layout.ox + c * cell, layout.oy + r * cell, cell + 0.6, cell + 0.6);
      }
    }

    // --- internal gridlines
    ctx.strokeStyle = PAL.boardLine;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (r = 0; r < lv.rows; r++) {
      for (c = 0; c < lv.cols; c++) {
        i = c + r * cols;
        if (!lv.region[i]) continue;
        var x0 = layout.ox + c * cell, y0 = layout.oy + r * cell;
        if (c + 1 < lv.cols && lv.region[i + 1]) { ctx.moveTo(x0 + cell, y0 + 2); ctx.lineTo(x0 + cell, y0 + cell - 2); }
        if (r + 1 < lv.rows && lv.region[i + cols]) { ctx.moveTo(x0 + 2, y0 + cell); ctx.lineTo(x0 + cell - 2, y0 + cell); }
      }
    }
    ctx.stroke();

    // --- crisp white perimeter around the irregular region
    ctx.strokeStyle = PAL.boardEdge;
    ctx.lineWidth = Math.max(3, cell * 0.10);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (r = 0; r < lv.rows; r++) {
      for (c = 0; c < lv.cols; c++) {
        i = c + r * cols;
        if (!lv.region[i]) continue;
        var bx = layout.ox + c * cell, by = layout.oy + r * cell;
        if (r === 0 || !lv.region[i - cols]) { ctx.moveTo(bx, by); ctx.lineTo(bx + cell, by); }
        if (r === lv.rows - 1 || !lv.region[i + cols]) { ctx.moveTo(bx, by + cell); ctx.lineTo(bx + cell, by + cell); }
        if (c === 0 || !lv.region[i - 1]) { ctx.moveTo(bx, by); ctx.lineTo(bx, by + cell); }
        if (c === lv.cols - 1 || !lv.region[i + 1]) { ctx.moveTo(bx + cell, by); ctx.lineTo(bx + cell, by + cell); }
      }
    }
    ctx.stroke();

    // --- colour gates: only a matching creature may pass
    for (r = 0; r < lv.rows; r++) {
      for (c = 0; c < lv.cols; c++) {
        i = c + r * cols;
        var gv = lv.gate ? lv.gate[i] : 0;
        if (!gv) continue;
        var gcol = CREATURE_COLORS[(gv - 1) % CREATURE_COLORS.length];
        var gx = layout.ox + c * cell, gy = layout.oy + r * cell;
        ctx.save();
        fillRR(gx + cell * 0.06, gy + cell * 0.06, cell * 0.88, cell * 0.88, cell * 0.18, gcol.line);
        ctx.globalAlpha = 0.30;
        fillRR(gx + cell * 0.10, gy + cell * 0.10, cell * 0.80, cell * 0.80, cell * 0.15, gcol.base);
        ctx.globalAlpha = 1;
        // vertical bars
        ctx.strokeStyle = gcol.base;
        ctx.lineWidth = Math.max(2.4, cell * 0.09);
        ctx.lineCap = 'round';
        ctx.beginPath();
        for (var bi = 0; bi < 3; bi++) {
          var bx = gx + cell * (0.26 + bi * 0.24);
          ctx.moveTo(bx, gy + cell * 0.20);
          ctx.lineTo(bx, gy + cell * 0.80);
        }
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.75)';
        ctx.lineWidth = Math.max(1.2, cell * 0.035);
        ctx.beginPath();
        ctx.moveTo(gx + cell * 0.18, gy + cell * 0.22);
        ctx.lineTo(gx + cell * 0.82, gy + cell * 0.22);
        ctx.moveTo(gx + cell * 0.18, gy + cell * 0.78);
        ctx.lineTo(gx + cell * 0.82, gy + cell * 0.78);
        ctx.stroke();
        ctx.restore();
      }
    }

    // --- solid crates: blocky, no head, no eyes - never mistakable for a creature
    for (r = 0; r < lv.rows; r++) {
      for (c = 0; c < lv.cols; c++) {
        i = c + r * cols;
        var cv = lv.crate ? lv.crate[i] : 0;
        if (!cv) continue;
        var ccol = CREATURE_COLORS[(cv - 1) % CREATURE_COLORS.length];
        var kx = layout.ox + c * cell + cell * 0.07, ky = layout.oy + r * cell + cell * 0.07;
        var ks = cell * 0.86;
        fillRR(kx, ky + 2.5, ks, ks, cell * 0.10, 'rgba(20,26,38,0.35)');
        fillRR(kx, ky, ks, ks, cell * 0.10, ccol.base);
        strokeRR(kx + 1, ky + 1, ks - 2, ks - 2, cell * 0.09, ccol.line, Math.max(2, cell * 0.07));
        // plank cross-bracing so it reads as cargo, not a body segment
        ctx.save();
        ctx.strokeStyle = ccol.line;
        ctx.globalAlpha = 0.75;
        ctx.lineWidth = Math.max(1.6, cell * 0.055);
        ctx.beginPath();
        ctx.moveTo(kx + ks * 0.16, ky + ks * 0.16); ctx.lineTo(kx + ks * 0.84, ky + ks * 0.84);
        ctx.moveTo(kx + ks * 0.84, ky + ks * 0.16); ctx.lineTo(kx + ks * 0.16, ky + ks * 0.84);
        ctx.stroke();
        ctx.globalAlpha = 0.55;
        ctx.strokeStyle = ccol.hi;
        ctx.lineWidth = Math.max(1.4, cell * 0.05);
        ctx.beginPath();
        ctx.moveTo(kx + ks * 0.16, ky + ks * 0.17); ctx.lineTo(kx + ks * 0.84, ky + ks * 0.17);
        ctx.stroke();
        ctx.restore();
      }
    }

    // --- rock blocks
    for (r = 0; r < lv.rows; r++) {
      for (c = 0; c < lv.cols; c++) {
        i = c + r * cols;
        if (!lv.wall[i]) continue;
        var wx = layout.ox + c * cell + cell * 0.09, wy = layout.oy + r * cell + cell * 0.09;
        var ws = cell * 0.82;
        fillRR(wx, wy + 2, ws, ws, cell * 0.20, 'rgba(20,26,38,0.35)');
        fillRR(wx, wy, ws, ws, cell * 0.20, PAL.wall);
        fillRR(wx + ws * 0.13, wy + ws * 0.11, ws * 0.74, ws * 0.26, cell * 0.10, PAL.wallTop);
      }
    }
    ctx.restore();
  }

  function drawCreature(cr, isDragged) {
    if (cr.exited) {
      var a0 = anims[cr.id];
      if (!a0 || a0.t >= 1 || !a0.feed) return;   // still finishing its slurp
    }
    var pts = renderPointsFor(cr);
    if (!pts.length) return;
    var col = CREATURE_COLORS[cr.color % CREATURE_COLORS.length];
    var cell = layout.cell;
    var wBody = cell * 0.62;
    var a = anims[cr.id];

    ctx.save();
    if (a && a.shake > 0) {
      var d = Core.DIRS[a.shakeDir] || { dc: 0, dr: 0 };
      var amp = a.shake * cell * 0.16 * Math.sin(a.shake * 22);
      ctx.translate(d.dc * amp, d.dr * amp);
    }

    // grabbed / hinted glow
    var glow = 0;
    if (isDragged) glow = 1;
    else if (app.hintCreature === cr.id && Date.now() < app.hintUntil) glow = 0.55 + 0.45 * Math.sin(Date.now() / 130);
    else if (a && a.glow > 0) glow = a.glow;
    if (glow > 0) {
      ctx.save();
      ctx.strokeStyle = col.hi;
      ctx.globalAlpha = 0.34 * glow;
      ctx.lineWidth = wBody + cell * (0.30 + 0.10 * Math.sin(Date.now() / 150));
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      strokePath(pts);
      ctx.restore();
    }

    // dark outline
    ctx.strokeStyle = col.line;
    ctx.lineWidth = wBody + Math.max(3.5, cell * 0.12);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    strokePath(pts);

    // body
    ctx.strokeStyle = col.base;
    ctx.lineWidth = wBody;
    strokePath(pts);

    // glossy highlight along the top of the body
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = col.hi;
    ctx.lineWidth = wBody * 0.30;
    ctx.translate(0, -wBody * 0.20);
    strokePath(pts, 0.72);
    ctx.restore();

    // grab chevron on the segment behind the head
    if (pts.length >= 2 && cr.ice <= 0) drawChevron(pts, col, cell);

    // head
    drawHead(cr, pts, col, cell, isDragged);

    // frozen casing + countdown
    if (cr.ice > 0) drawIce(cr, pts, cell);
    ctx.restore();
  }

  /**
   * Frosted ice casing. The creature underneath stays readable (the overlay is
   * translucent) but the countdown makes the ordering constraint legible: you
   * must free that many other creatures before this one thaws.
   */
  function drawIce(cr, pts, cell) {
    var w = cell * 0.62;
    ctx.save();

    // frosted casing - deliberately translucent so the creature's own colour
    // still reads through; the player must be able to tell WHICH creature is
    // frozen at a glance
    ctx.strokeStyle = PAL.ice;
    ctx.lineWidth = w + cell * 0.30;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    strokePath(pts);

    // crisp rim
    ctx.globalAlpha = 0.85;
    ctx.strokeStyle = PAL.iceEdge;
    ctx.lineWidth = Math.max(1.8, cell * 0.055);
    strokePath(pts);

    // a few crystal facets
    ctx.globalAlpha = 0.42;
    ctx.strokeStyle = PAL.iceDeep;
    ctx.lineWidth = Math.max(1, cell * 0.028);
    for (var i = 0; i < pts.length; i += 2) {
      var p = pts[i];
      var sz = cell * 0.17;
      ctx.beginPath();
      ctx.moveTo(p.x - sz, p.y - sz * 0.5); ctx.lineTo(p.x + sz * 0.2, p.y + sz);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // countdown badge on the head
    var h = pts[0];
    var rBadge = cell * 0.30;
    ctx.beginPath(); ctx.arc(h.x, h.y, rBadge + Math.max(2, cell * 0.055), 0, Math.PI * 2);
    ctx.fillStyle = PAL.iceEdge; ctx.fill();
    ctx.beginPath(); ctx.arc(h.x, h.y, rBadge, 0, Math.PI * 2);
    ctx.fillStyle = PAL.iceDeep; ctx.fill();
    text(String(cr.ice), h.x, h.y + 0.5, Math.max(12, cell * 0.40), '#ffffff', 'center', '900');
    ctx.restore();
  }

  function strokePath(pts, shrink) {
    if (pts.length === 1) {
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      ctx.lineTo(pts[0].x + 0.01, pts[0].y);
      ctx.stroke();
      return;
    }
    var n = shrink ? Math.max(2, Math.ceil(pts.length * (shrink || 1))) : pts.length;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < n; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
  }

  function drawChevron(pts, col, cell) {
    var i = Math.min(1, pts.length - 1);
    var p = pts[i], q = pts[i - 1];
    var dx = q.x - p.x, dy = q.y - p.y;
    var len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
    var px = -dy, py = dx;
    var s = cell * 0.15;
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.strokeStyle = 'rgba(255,255,255,0.92)';
    ctx.lineWidth = Math.max(2, cell * 0.075);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(p.x - dx * s * 0.2 + px * s, p.y - dy * s * 0.2 + py * s);
    ctx.lineTo(p.x + dx * s * 1.0, p.y + dy * s * 1.0);
    ctx.lineTo(p.x - dx * s * 0.2 - px * s, p.y - dy * s * 0.2 - py * s);
    ctx.stroke();
    ctx.restore();
  }

  function drawHead(cr, pts, col, cell, isDragged) {
    var h = pts[0];
    var nxt = pts.length > 1 ? pts[1] : { x: h.x, y: h.y + 1 };
    var dx = h.x - nxt.x, dy = h.y - nxt.y;
    var len = Math.hypot(dx, dy);
    if (len < 0.001) { dx = 0; dy = -1; } else { dx /= len; dy /= len; }

    var a = anims[cr.id];
    var shrink = 1;
    if (a && a.feed && a.t < 1) shrink = Math.max(0.18, 1 - easeOut(a.t) * 0.55);
    var rHead = cell * 0.375 * shrink * (isDragged ? 1.06 : 1);

    // cap
    ctx.beginPath(); ctx.arc(h.x, h.y, rHead + Math.max(2.2, cell * 0.06), 0, Math.PI * 2);
    ctx.fillStyle = col.line; ctx.fill();
    ctx.beginPath(); ctx.arc(h.x, h.y, rHead, 0, Math.PI * 2);
    ctx.fillStyle = col.base; ctx.fill();
    // gloss
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.beginPath(); ctx.arc(h.x - rHead * 0.28, h.y - rHead * 0.36, rHead * 0.48, 0, Math.PI * 2);
    ctx.fillStyle = col.hi; ctx.fill();
    ctx.restore();

    if (shrink < 0.55) return;

    // two simple eyes, offset along the facing direction
    var px = -dy, py = dx;
    var eo = rHead * 0.42, fo = rHead * 0.30;
    var er = rHead * 0.30;
    for (var s = -1; s <= 1; s += 2) {
      var ex = h.x + dx * fo + px * eo * s;
      var ey = h.y + dy * fo + py * eo * s;
      ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff'; ctx.fill();
      ctx.lineWidth = Math.max(1, cell * 0.02); ctx.strokeStyle = 'rgba(20,26,38,0.35)'; ctx.stroke();
      ctx.beginPath(); ctx.arc(ex + dx * er * 0.30, ey + dy * er * 0.30, er * 0.50, 0, Math.PI * 2);
      ctx.fillStyle = '#1d2330'; ctx.fill();
    }
  }

  /**
   * Gate bars are painted ON TOP of the creatures. A gate underneath a body
   * would otherwise be invisible, and the player would have no way to know a
   * route is colour-locked.
   */
  function drawGateOverlay() {
    var lv = app.levelData, cell = layout.cell, cols = lv.cols;
    if (!lv.gate) return;
    for (var r = 0; r < lv.rows; r++) {
      for (var c = 0; c < lv.cols; c++) {
        var gv = lv.gate[c + r * cols];
        if (!gv) continue;
        var gcol = CREATURE_COLORS[(gv - 1) % CREATURE_COLORS.length];
        var gx = layout.ox + c * cell, gy = layout.oy + r * cell;
        ctx.save();
        ctx.strokeStyle = gcol.line;
        ctx.lineWidth = Math.max(2.6, cell * 0.10);
        ctx.lineCap = 'round';
        ctx.beginPath();
        for (var bi = 0; bi < 3; bi++) {
          var bx = gx + cell * (0.26 + bi * 0.24);
          ctx.moveTo(bx, gy + cell * 0.16);
          ctx.lineTo(bx, gy + cell * 0.84);
        }
        ctx.stroke();
        ctx.strokeStyle = gcol.base;
        ctx.lineWidth = Math.max(1.4, cell * 0.055);
        ctx.beginPath();
        for (var bj = 0; bj < 3; bj++) {
          var bx2 = gx + cell * (0.26 + bj * 0.24);
          ctx.moveTo(bx2, gy + cell * 0.16);
          ctx.lineTo(bx2, gy + cell * 0.84);
        }
        ctx.stroke();
        // frame
        strokeRR(gx + cell * 0.07, gy + cell * 0.07, cell * 0.86, cell * 0.86,
                 cell * 0.16, gcol.line, Math.max(2, cell * 0.07));
        strokeRR(gx + cell * 0.07, gy + cell * 0.07, cell * 0.86, cell * 0.86,
                 cell * 0.16, gcol.hi, Math.max(1, cell * 0.03));
        ctx.restore();
      }
    }
  }

  function drawHoles() {
    var lv = app.levelData, cell = layout.cell;
    for (var i = 0; i < lv.holes.length; i++) {
      var hole = lv.holes[i];
      var col = CREATURE_COLORS[hole.color % CREATURE_COLORS.length];
      var x = cx(hole.c), y = cy(hole.r);
      var R = cell * 0.44;

      // any creature of this colour still on the board? -> pulse it
      var live = false;
      for (var k = 0; k < app.game.creatures.length; k++) {
        if (!app.game.creatures[k].exited && app.game.creatures[k].color === hole.color) { live = true; break; }
      }
      var pulse = live ? 1 + 0.05 * Math.sin(Date.now() / 320 + i) : 1;

      ctx.save();
      ctx.globalAlpha = live ? 1 : 0.42;

      // "throat": a short coloured chute joining the hole to each mouth cell,
      // so it is unambiguous which board cell feeds this hole.
      for (var mm = 0; mm < hole.mouths.length; mm++) {
        var mIdx = hole.mouths[mm];
        var mc = mIdx % lv.cols, mr = (mIdx - (mIdx % lv.cols)) / lv.cols;
        var tx = cx(mc), ty = cy(mr);
        ctx.save();
        ctx.strokeStyle = col.line;
        ctx.lineWidth = cell * 0.40;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + (tx - x) * 0.62, y + (ty - y) * 0.62);
        ctx.stroke();
        ctx.strokeStyle = col.base;
        ctx.lineWidth = cell * 0.26;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + (tx - x) * 0.60, y + (ty - y) * 0.60);
        ctx.stroke();
        ctx.restore();
      }
      // outer ring
      ctx.beginPath(); ctx.arc(x, y, R * pulse, 0, Math.PI * 2);
      ctx.fillStyle = col.line; ctx.fill();
      ctx.beginPath(); ctx.arc(x, y, R * pulse * 0.90, 0, Math.PI * 2);
      ctx.fillStyle = col.base; ctx.fill();
      ctx.beginPath(); ctx.arc(x - R * 0.18, y - R * 0.22, R * 0.62, Math.PI * 0.9, Math.PI * 1.9);
      ctx.strokeStyle = col.hi; ctx.lineWidth = Math.max(2, cell * 0.06); ctx.stroke();
      // dark mouth (opaque - hides segments as they feed in)
      ctx.beginPath(); ctx.arc(x, y, R * 0.60, 0, Math.PI * 2);
      ctx.fillStyle = PAL.holeDark; ctx.fill();
      ctx.beginPath(); ctx.arc(x, y, R * 0.60, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.restore();
    }
  }

  // =====================================================================
  // Screens
  // =====================================================================

  function drawBackground() {
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, PAL.bgTop);
    grad.addColorStop(0.55, PAL.bg);
    grad.addColorStop(1, PAL.bgDeep);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  function drawTopBar() {
    var lv = app.level;
    // level pill
    fillRR(10, 12, 104, 48, 14, PAL.panel);
    strokeRR(11, 13, 102, 46, 13, PAL.panelEdge, 2);
    text('LEVEL', 62, 26, 10, PAL.inkSoft, 'center', '800');
    text(String(lv), 62, 41, 19, PAL.ink, 'center', '900');
    var diff = app.levelData && app.levelData.difficulty;
    if (diff) {
      var dc = diff.score >= 80 ? PAL.danger : diff.score >= 60 ? PAL.warn
             : diff.score >= 35 ? PAL.accent : PAL.good;
      fillRR(16, 50, 92, 13, 6.5, dc);
      text(diff.label, 62, 57, 9, '#ffffff', 'center', '900');
    }

    // timer
    var frac = app.timeLimit > 0 ? app.timeLeft / app.timeLimit : 0;
    var low = app.timeLeft <= 15;
    var timerCol = low ? PAL.danger : (frac < 0.35 ? PAL.warn : PAL.ink);
    fillRR(120, 12, 124, 48, 14, PAL.panel);
    strokeRR(121, 13, 122, 46, 13, low ? PAL.danger : PAL.panelEdge, low ? 3 : 2);
    var mm = Math.floor(Math.max(0, app.timeLeft) / 60);
    var ss = Math.floor(Math.max(0, app.timeLeft) % 60);
    drawIcon('clock', 143, 35, 19, timerCol);
    text(mm + ':' + (ss < 10 ? '0' : '') + ss, 191, 35, 23, timerCol, 'center', '900');
    ctx.save();
    rr(125, 51, 114, 5, 2.5); ctx.clip();
    ctx.fillStyle = '#e2e8f2'; ctx.fillRect(125, 51, 114, 5);
    ctx.fillStyle = low ? PAL.danger : (frac < 0.35 ? PAL.warn : PAL.good);
    ctx.fillRect(125, 51, 114 * Math.max(0, Math.min(1, frac)), 5);
    ctx.restore();

    // remaining creatures counter
    fillRR(250, 12, 52, 48, 14, PAL.panel);
    strokeRR(251, 13, 50, 46, 13, PAL.panelEdge, 2);
    text(String(app.game ? app.game.remainingCount() : 0), 276, 29, 20, PAL.ink, 'center', '900');
    text('LEFT', 276, 47, 10, PAL.inkSoft, 'center', '800');

    button('pause', 332, 8, MIN_BTN, MIN_BTN, null,
      { icon: 'pause', iconSize: 23, action: doPause, radius: 17 });
  }

  function drawPlayButtons() {
    var m = 10, gap = 9;
    var bw = (W - m * 2 - gap * 3) / 4;
    var g = app.game;
    button('undo', m, BTN_Y, bw, BTN_H, 'UNDO',
      { icon: 'undo', action: doUndo, enabled: !!(g && g.canUndo()), size: 12 });
    button('restart', m + (bw + gap), BTN_Y, bw, BTN_H, 'RESTART',
      { icon: 'restart', action: doRestart, size: 12 });
    button('hint', m + (bw + gap) * 2, BTN_Y, bw, BTN_H, 'HINT',
      { icon: 'hint', action: doHint, size: 12,
        badge: store.freeHints > 0 ? store.freeHints : 'AD',
        badgeColor: store.freeHints > 0 ? PAL.accent : PAL.warn });
    button('menu', m + (bw + gap) * 3, BTN_Y, bw, BTN_H, 'MENU',
      { icon: 'home', action: doMenu, size: 12 });
  }

  function drawPlay() {
    drawBackground();
    drawTopBar();
    drawBoard();

    var g = app.game;
    var dragId = drag ? drag.creatureId : -1;
    // non-dragged first so the grabbed creature renders on top
    for (var i = 0; i < g.creatures.length; i++) if (g.creatures[i].id !== dragId) drawCreature(g.creatures[i], false);
    if (dragId >= 0) drawCreature(g.creatures[dragId], true);

    drawGateOverlay();
    drawHoles();
    drawParticles();
    drawFloaters();
    drawPlayButtons();

    if (app.transition > 0) {
      ctx.save();
      ctx.globalAlpha = app.transition * 0.85;
      ctx.fillStyle = PAL.bg;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    if (app.toast && Date.now() < app.toast.until) {
      var tw = ctx.measureText(app.toast.text).width;
      fillRR(W / 2 - 130, 496, 260, 34, 17, 'rgba(35,44,64,0.92)');
      text(app.toast.text, W / 2, 513, 14, '#fff', 'center', '800');
    }
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var k = 1 - p.age / p.life;
      ctx.globalAlpha = Math.max(0, Math.min(1, k * 1.4));
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (0.4 + k * 0.6), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawFloaters() {
    for (var i = 0; i < floaters.length; i++) {
      var f = floaters[i];
      var k = 1 - f.age / f.life;
      ctx.globalAlpha = Math.max(0, Math.min(1, k * 1.5));
      text(f.text, f.x, f.y, 20, f.color, 'center', '900');
    }
    ctx.globalAlpha = 1;
  }

  function drawMenu() {
    drawBackground();

    // decorative creatures
    var t = Date.now() / 1000;
    for (var d = 0; d < 3; d++) {
      var col = CREATURE_COLORS[[0, 1, 3][d]];
      var baseY = 470 + d * 44;
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.strokeStyle = col.base;
      ctx.lineWidth = 22; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath();
      for (var s = 0; s <= 22; s++) {
        var x = -20 + s * 20;
        var y = baseY + Math.sin(s * 0.55 + t * (0.7 + d * 0.25) + d) * 13;
        if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.restore();
    }

    text('NEON', W / 2, 128, 54, PAL.ink, 'center', '900');
    ctx.save();
    var lg = ctx.createLinearGradient(60, 0, 340, 0);
    lg.addColorStop(0, '#00c8f0'); lg.addColorStop(0.5, '#a259f5'); lg.addColorStop(1, '#ff3ea5');
    ctx.fillStyle = lg;
    ctx.font = '900 54px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('UNRAVEL', W / 2, 182);
    ctx.restore();

    text('Drag each head into its matching hole', W / 2, 226, 15, PAL.inkSoft, 'center', '700');
    text('The body follows like a snake', W / 2, 248, 13, PAL.inkSoft, 'center', '600');

    fillRR(60, 282, 134, 62, 18, PAL.panel);
    strokeRR(61, 283, 132, 60, 17, PAL.panelEdge, 2);
    text('FURTHEST', 127, 300, 10, PAL.inkSoft, 'center', '800');
    text(String(store.furthest), 127, 324, 24, PAL.ink, 'center', '900');
    fillRR(206, 282, 134, 62, 18, PAL.panel);
    strokeRR(207, 283, 132, 60, 17, PAL.panelEdge, 2);

  // =====================================================================
  // Actions
  // =====================================================================

  function toast(msg) { app.toast = { text: msg, until: Date.now() + 1700 }; }

  function doPlay() { requestLevel(store.current || 1); }
  function doNext() { requestLevel(app.level + 1); }
  function doRestart() {
    if (!app.game) return;
    app.game.restart();
    app.timeLeft = app.timeLimit;
    app.screen = SCREEN.PLAY;
    app.stars = 0;
    app.winDelay = 0.45;
    app.combo = 0;
    app.comboBest = 0;
    app.lastExitAt = 0;
    anims = {};
    particles.length = 0;
    drag = null;
  }
  function doMenu() {
    app.screen = SCREEN.MENU;
    drag = null;
    if (!store.adsRemoved) bridgeShowBanner();
  }
  function doPause() { if (app.screen === SCREEN.PLAY) { app.screen = SCREEN.PAUSE; drag = null; } }
  function doResume() { if (app.screen === SCREEN.PAUSE) app.screen = SCREEN.PLAY; }
  function doUndo() {
    if (!app.game || !app.game.canUndo()) return;
    app.game.undo();
    anims = {};
    drag = null;
  }
  function doToggleSound() {
    store.sound = !store.sound;
    saveStore();
    if (store.sound) { audioInit(); audioResume(); sfxTap(); }
  }
  function doRemoveAds() {
    if (!bridgePurchaseRemoveAds()) toast('Store unavailable in browser');
  }

  function grantHint() {
    var h = Core.findHint(app.game);
    if (!h) { toast('No creature can exit - try UNDO'); return; }
    app.hintCreature = h.id;
    app.hintUntil = Date.now() + 3400;
    var cr = app.game.creatures[h.id];
    var p = cellCenter(cr.cells[0], app.game.cols);
    floatText(p.x, p.y - layout.cell, 'THIS ONE', CREATURE_COLORS[cr.color % CREATURE_COLORS.length].line);
    sfxStar(0);
  }

  function doHint() {
    if (!app.game || app.screen !== SCREEN.PLAY) return;
    if (store.freeHints > 0) {
      store.freeHints--;
      saveStore();
      grantHint();
      return;
    }
    app.pendingReward = 'hint';
    if (!bridgeShowRewarded()) {
      // standalone browser: no ad network, grant it so the game stays playable
      window.setTimeout(function () { if (window.NeonUnravel) window.NeonUnravel.onReward(); }, 120);
      toast('No ad available - hint granted');
    }
  }

  function doContinue() {
    app.pendingReward = 'continue';
    if (store.adsRemoved) { window.NeonUnravel.onReward(); return; }
    if (!bridgeShowRewarded()) {
      window.setTimeout(function () { if (window.NeonUnravel) window.NeonUnravel.onReward(); }, 120);
      toast('No ad available - time granted');
    }
  }

  // =====================================================================
  // Input - touch is handled by touch events, mouse by pointer events.
  // No overlap, no double-handling.
  // =====================================================================

  function clientToCanvas(clientX, clientY) {
    var rect = canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left) * (W / rect.width),
      y: (clientY - rect.top) * (H / rect.height)
    };
  }
  function canvasToClient(x, y) {
    var rect = canvas.getBoundingClientRect();
    return { x: rect.left + x * (rect.width / W), y: rect.top + y * (rect.height / H) };
  }

  function hitButton(x, y) {
    for (var i = uiButtons.length - 1; i >= 0; i--) {
      var b = uiButtons[i];
      if (!b.enabled) continue;
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b;
    }
    return null;
  }

  function findGrabbableHead(x, y) {
    if (!app.game || app.screen !== SCREEN.PLAY) return -1;
    var best = -1, bestD = Infinity;
    var reach = layout.cell * 1.05;
    for (var i = 0; i < app.game.creatures.length; i++) {
      var cr = app.game.creatures[i];
      if (cr.exited || cr.feeding >= 0 || !cr.cells.length) continue;
      var p = cellCenter(cr.cells[0], app.game.cols);
      var d = Math.hypot(p.x - x, p.y - y);
      if (d < reach && d < bestD) { bestD = d; best = i; }
    }
    // an iced creature is not grabbable, but say so instead of ignoring the tap
    if (best >= 0 && app.game.creatures[best].ice > 0) {
      var frozen = app.game.creatures[best];
      var fp = cellCenter(frozen.cells[0], app.game.cols);
      floatText(fp.x, fp.y - layout.cell * 0.8, 'FROZEN: ' + frozen.ice + ' MORE', PAL.iceInk);
      animFor(best).shake = 1;
      animFor(best).shakeDir = Core.DIR_LEFT;
      sfxFrozen();
      return -1;
    }
    return best;
  }

  function onDown(x, y) {
    audioInit(); audioResume();
    var b = hitButton(x, y);
    if (b) {
      pressedId = b.id;
      sfxTap();
      render();                       // synchronous press feedback
      return;
    }
    pressedId = null;
    if (app.screen !== SCREEN.PLAY) return;
    var id = findGrabbableHead(x, y);
    if (id < 0) return;
    app.game.beginGesture();
    drag = { creatureId: id, x: x, y: y, steps: 0, lastStepAt: 0 };
    animFor(id).glow = 1;
    app.hintCreature = -1;
    render();
  }

  function onMove(x, y) {
    if (drag) { drag.x = x; drag.y = y; return; }
    if (pressedId) {
      var b = hitButton(x, y);
      if (!b || b.id !== pressedId) { pressedId = null; }
    }
  }

  function onUp(x, y) {
    if (pressedId) {
      var b = hitButton(x, y);
      var was = pressedId;
      pressedId = null;
      if (b && b.id === was && b.action) { b.action(); }
      render();
      return;
    }
    if (drag) {
      app.game.endGesture();
      drag = null;
    }
  }

  function onCancel() {
    pressedId = null;
    if (drag) { app.game.endGesture(); drag = null; }
  }

  var lastTouchPt = { x: 0, y: 0 };

  /** Real devices sometimes deliver a touch event with no usable point
      (cancelled gestures, palm rejection). Fall back to the last known one
      rather than throwing inside an event handler. */
  function pointFrom(e) {
    var t = (e.changedTouches && e.changedTouches[0]) || (e.touches && e.touches[0]) || null;
    if (!t) return lastTouchPt;
    lastTouchPt = clientToCanvas(t.clientX, t.clientY);
    return lastTouchPt;
  }

  function bindInput() {
    canvas.addEventListener('touchstart', function (e) {
      e.preventDefault();
      var p = pointFrom(e);
      onDown(p.x, p.y);
    }, { passive: false });
    canvas.addEventListener('touchmove', function (e) {
      e.preventDefault();
      var p = pointFrom(e);
      onMove(p.x, p.y);
    }, { passive: false });
    canvas.addEventListener('touchend', function (e) {
      e.preventDefault();
      var p = pointFrom(e);
      onUp(p.x, p.y);
    }, { passive: false });
    canvas.addEventListener('touchcancel', function (e) { e.preventDefault(); onCancel(); }, { passive: false });

    // desktop mouse only - touch never reaches these
    canvas.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'touch') return;
      e.preventDefault();
      var p = clientToCanvas(e.clientX, e.clientY);
      onDown(p.x, p.y);
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    });
    canvas.addEventListener('pointermove', function (e) {
      if (e.pointerType === 'touch') return;
      var p = clientToCanvas(e.clientX, e.clientY);
      onMove(p.x, p.y);
    });
    canvas.addEventListener('pointerup', function (e) {
      if (e.pointerType === 'touch') return;
      var p = clientToCanvas(e.clientX, e.clientY);
      onUp(p.x, p.y);
    });
    canvas.addEventListener('pointercancel', function (e) {
      if (e.pointerType === 'touch') return;
      onCancel();
    });
    canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }

  // =====================================================================
  // Drag -> movement.  The head steps one orthogonal cell at a time toward
  // the finger, as fast as the step animation allows.
  // =====================================================================

  var lastBumpAt = 0;

  function autoFeed(id) {
    var g = app.game;
    var cr = g.creatures[id];
    if (!cr || cr.exited) return false;
    var a = animFor(id);
    if (a.t < 1) return true;
    var d = Core.holeDirFromHead(g, id);
    if (d < 0) return false;
    var before = cr.cells.slice();
    var holeIdx = -1;
    var hc = g.colOf(before[0]) + Core.DIRS[d].dc, hr = g.rowOf(before[0]) + Core.DIRS[d].dr;
    holeIdx = g.idx(hc, hr);
    var res = g.stepHead(id, d);
    if (!res.ok) return false;
    beginStepAnim(id, before, null, true, holeIdx, 0.085);
    sfxSlurp();
    var p = cellCenter(holeIdx, g.cols);
    burst(p.x, p.y, cr.color, 8);
    if (res.exited) {
      burst(p.x, p.y, cr.color, 30);
      sfxExited(cr.color);
      var now = Date.now() / 1000;
      if (app.lastExitAt && now - app.lastExitAt <= COMBO_WINDOW) {
        app.combo++;
        if (app.combo > app.comboBest) app.comboBest = app.combo;
        sfxCombo(app.combo);
        floatText(p.x, p.y - layout.cell * 0.9, 'CHAIN x' + (app.combo + 1), PAL.warn);
      } else {
        app.combo = 0;
        floatText(p.x, p.y - layout.cell * 0.9, 'OUT!', CREATURE_COLORS[cr.color % CREATURE_COLORS.length].line);
      }
      app.lastExitAt = now;

      // ice countdowns tick on every exit; anything that hits zero shatters
      if (res.shattered && res.shattered.length) {
        sfxShatter();
        res.shattered.forEach(function (sid) {
          var frozen = g.creatures[sid];
          if (!frozen || frozen.exited || !frozen.cells.length) return;
          burstShatter(frozen);
          animFor(sid).glow = 1;
          var fp = cellCenter(frozen.cells[0], g.cols);
          floatText(fp.x, fp.y - layout.cell * 0.8, 'FREE!', PAL.iceInk);
        });
      }
      if (g.isWon() && drag) { g.endGesture(); drag = null; }
    }
    return true;
  }

  function updateDrag() {
    var g = app.game;
    if (!g) return;

    // creatures that have begun feeding keep feeding, drag or no drag
    for (var i = 0; i < g.creatures.length; i++) {
      var c = g.creatures[i];
      if (!c.exited && c.feeding >= 0) autoFeed(c.id);
    }

    if (!drag || app.screen !== SCREEN.PLAY) return;
    var cr = g.creatures[drag.creatureId];
    if (!cr || cr.exited) { g.endGesture(); drag = null; return; }
    if (cr.feeding >= 0) return;

    var a = animFor(cr.id);
    if (a.t < 1) return;                       // one cell at a time, smoothly

    var head = cr.cells[0];
    var hx = cx(g.colOf(head)), hy = cy(g.rowOf(head));
    var dx = (drag.x - hx) / layout.cell;
    var dy = (drag.y - hy) / layout.cell;
    var adx = Math.abs(dx), ady = Math.abs(dy);
    if (Math.max(adx, ady) < 0.55) return;     // dead zone - no jitter

    var order = [];
    if (adx >= ady) {
      order.push(dx > 0 ? Core.DIR_RIGHT : Core.DIR_LEFT);
      if (ady > 0.35) order.push(dy > 0 ? Core.DIR_DOWN : Core.DIR_UP);
    } else {
      order.push(dy > 0 ? Core.DIR_DOWN : Core.DIR_UP);
      if (adx > 0.35) order.push(dx > 0 ? Core.DIR_RIGHT : Core.DIR_LEFT);
    }

    for (var k = 0; k < order.length; k++) {
      var dir = order[k];
      var probe = g.canStep(cr.id, dir);
      if (!probe.ok) continue;
      if (probe.type === 'feed') { autoFeed(cr.id); return; }
      var before = cr.cells.slice();
      var res = g.stepHead(cr.id, dir);
      if (!res.ok) continue;
      var dist = Math.max(adx, ady);
      beginStepAnim(cr.id, before, cr.cells, false, -1, Math.max(0.030, 0.075 - dist * 0.010));
      drag.steps++;
      sfxStep();
      return;
    }

    // nothing legal in the direction the finger is pulling -> bump feedback
    var now = Date.now();
    if (now - lastBumpAt > 320) {
      lastBumpAt = now;
      a.shake = 1;
      a.shakeDir = order[0];
      app.boardShake = 4;
      var why = g.canStep(cr.id, order[0]);
      if (why.reason === 'gate') {
        var hp = cellCenter(cr.cells[0], g.cols);
        floatText(hp.x, hp.y - layout.cell * 0.8, 'WRONG COLOUR', PAL.danger);
      }
      sfxBlocked();
    }
  }

  // =====================================================================
  // Main loop
  // =====================================================================

  function tick(now) {
    var dt = app.lastT ? Math.min(0.05, (now - app.lastT) / 1000) : 0.016;
    app.lastT = now;

    if (app.transition > 0) app.transition = Math.max(0, app.transition - dt * 3.2);
    if (app.boardShake > 0) app.boardShake = Math.max(0, app.boardShake - dt * 26);

    updateAnims(dt);
    updateParticles(dt);

    if (app.screen === SCREEN.PLAY && app.game) {
      updateDrag();
      if (app.game.isWon()) {
        // let the last slurp finish, then celebrate. Driven from the loop (not
        // a setTimeout) so pausing mid-slurp can never strand a won board.
        app.winDelay -= dt;
        if (app.winDelay <= 0) completeLevel();
      } else {
        app.elapsed += dt;
        app.timeLeft -= dt;
        if (app.timeLeft <= 0) { app.timeLeft = 0; failLevel(); }
      }
    }

    render();
    window.requestAnimationFrame(tick);
  }

  function render() {
    uiButtons.length = 0;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    switch (app.screen) {
      case SCREEN.MENU: drawMenu(); break;
      case SCREEN.PLAY: drawPlay(); break;
      case SCREEN.WIN: drawWin(); break;
      case SCREEN.FAIL: drawFail(); break;
      case SCREEN.PAUSE: drawPause(); break;
      case SCREEN.LOADING: drawLoading(); break;
      default: drawMenu();
    }
  }

  // =====================================================================
  // Boot
  // =====================================================================

  function resize() {
    dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    var wrap = document.getElementById('nu-canvas-wrap');
    var availW = window.innerWidth, availH = window.innerHeight;
    if (wrap) {
      // clientWidth/Height INCLUDE padding - subtract it so the canvas stays
      // inside the safe-area inset box instead of spilling under a notch.
      var cs = window.getComputedStyle(wrap);
      availW = wrap.clientWidth - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0);
      availH = wrap.clientHeight - (parseFloat(cs.paddingTop) || 0) - (parseFloat(cs.paddingBottom) || 0);
    }
    availW = Math.max(80, availW);
    availH = Math.max(80, availH);
    var scale = Math.min(availW / W, availH / H);
    canvas.style.width = Math.floor(W * scale) + 'px';
    canvas.style.height = Math.floor(H * scale) + 'px';
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    dpr = canvas.width / W;         // effective logical -> device scale
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = true;
    render();
  }

  function boot() {
    canvas = document.getElementById('nu-canvas');
    ctx = canvas.getContext('2d', { alpha: false });
    loadStore();
    store.adsRemoved = store.adsRemoved || bridgeIsAdsRemoved();
    bindInput();
    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', function () { window.setTimeout(resize, 120); });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden && window.NeonUnravel) window.NeonUnravel.onPause();
    });
    if (!store.adsRemoved) bridgeShowBanner();
    window.requestAnimationFrame(tick);
  }

  // ------------------------------------------------------- native hooks
  window.NeonUnravel = {
    onPause: function () {
      if (app.screen === SCREEN.PLAY) { app.screen = SCREEN.PAUSE; drag = null; }
      try { if (audio.ready) audio.ctx.suspend(); } catch (e) {}
    },
    onResume: function () {
      audioResume();
      // deliberately stays paused; the player taps RESUME
    },
    onReward: function () {
      var what = app.pendingReward;
      app.pendingReward = null;
      if (what === 'hint') { grantHint(); }
      else if (what === 'continue') {
        app.timeLeft = Math.max(app.timeLeft, 0) + 30;
        app.timeLimit = Math.max(app.timeLimit, app.timeLeft);
        app.screen = SCREEN.PLAY;
        toast('+30 seconds');
        sfxStar(2);
      }
    },
    onAdsRemovedChanged: function (removed) {
      store.adsRemoved = !!removed;
      saveStore();
      if (store.adsRemoved) bridgeHideBanner(); else bridgeShowBanner();
    }
  };

  // ------------------------------------------------- automated test hook
  window.__NU = {
    get game() { return app.game; },
    get level() { return app.levelData; },
    get screen() { return app.screen; },
    get state() { return app; },
    get core() { return Core; },
    get store() { return store; },
    get layout() { return layout; },
    get buttons() { return uiButtons.map(function (b) { return { id: b.id, x: b.x, y: b.y, w: b.w, h: b.h, enabled: b.enabled }; }); },
    get dragging() { return drag ? drag.creatureId : -1; },
    get animating() {
      for (var k in anims) if (anims[k].t < 1) return true;
      return false;
    },
    /** logical canvas coords -> CSS/client px (for real touch dispatch) */
    canvasToClient: canvasToClient,
    clientToCanvas: clientToCanvas,
    /** grid cell -> CSS/client px centre */
    cellToClient: function (c, r) { return canvasToClient(cx(c), cy(r)); },
    /** head of a creature -> CSS/client px centre */
    headToClient: function (id) {
      var cr = app.game.creatures[id];
      if (!cr || !cr.cells.length) return null;
      var p = cellCenter(cr.cells[0], app.game.cols);
      return canvasToClient(p.x, p.y);
    },
    buttonToClient: function (id) {
      for (var i = 0; i < uiButtons.length; i++) {
        if (uiButtons[i].id === id) {
          return canvasToClient(uiButtons[i].x + uiButtons[i].w / 2, uiButtons[i].y + uiButtons[i].h / 2);
        }
      }
      return null;
    },
    buttonRectCss: function (id) {
      for (var i = 0; i < uiButtons.length; i++) {
        if (uiButtons[i].id === id) {
          var rect = canvas.getBoundingClientRect();
          var sx = rect.width / W, sy = rect.height / H;
          return { w: uiButtons[i].w * sx, h: uiButtons[i].h * sy,
                   x: rect.left + uiButtons[i].x * sx, y: rect.top + uiButtons[i].y * sy };
        }
      }
      return null;
    },
    cellsOf: function (id) { return app.game.cellsOf(id); },
    get difficulty() { return app.levelData ? app.levelData.difficulty : null; },
    get combo() { return app.combo; },
    get coins() { return store.coins; },
    startLevel: startLevel,
    requestLevel: requestLevel,
    goMenu: doMenu,
    setTimeLeft: function (t) { app.timeLeft = t; },
    version: Core.VERSION
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
