<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#dfe6f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Neon Unravel</title>
<style>
  /*
   * STRUCTURAL RULE: nothing is ever positioned above #nu-canvas.
   * Every menu, HUD element, button and results screen is painted onto the
   * canvas itself. There is no overlay layer that could silently swallow
   * touch input.
   */
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #eef3fa;
    background-image: linear-gradient(to bottom, #eef3fa 0%, #dfe6f0 55%, #cbd6e6 100%);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #nu-app {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    background: transparent;
  }
  /* Reserves vertical space for a NATIVE banner drawn by the Android wrapper.
     It is a flex sibling stacked above the canvas - never on top of it. */
  #nu-banner-slot {
    flex: 0 0 auto;
    height: 50px;
    width: 100%;
    padding-top: env(safe-area-inset-top);
    box-sizing: content-box;
    background: #c3cfe1;
    display: none;
  }
  #nu-canvas-wrap {
    flex: 1 1 auto;
    display: flex; align-items: center; justify-content: center;
    min-height: 0;
    padding:
      max(6px, env(safe-area-inset-top))
      max(6px, env(safe-area-inset-right))
      max(10px, env(safe-area-inset-bottom))
      max(6px, env(safe-area-inset-left));
    box-sizing: border-box;
  }
  /* No border-radius: rounded corners would make the corner pixels of the
     canvas box fall through to the wrapper, so touches there would not reach
     the game. The canvas paints its own rounded look instead. */
  #nu-canvas {
    display: block;
    touch-action: none;
    background: #dfe6f0;
  }
</style>
</head>

    <div id="nu-banner-slot"></div>
    <div id="nu-canvas-wrap">

      var cur = q[qh++];
      var cc = cur % cols, cr = (cur - cc) / cols;
      var nd = dist[cur] + 1;
      for (var d = 0; d < 4; d++) {
        var nc = cc + DIRS[d].dc, nr = cr + DIRS[d].dr;
        if (nc < 0 || nr < 0 || nc >= cols || nr >= rows) continue;
        var ni = nc + nr * cols;
        if (blocked[ni]) continue;
        if (dist[ni] > nd) { dist[ni] = nd; q.push(ni); }
      }
    }
    return dist;
  }

  function keyOf(body) {
    var s = '';
    for (var i = 0; i < body.length; i++) s += String.fromCharCode(body[i]);
    return s;
  }

  function Heap() { this.a = []; }
  Heap.prototype.push = function (node) {
    var a = this.a; a.push(node);
    var i = a.length - 1;
    while (i > 0) {
      var p = (i - 1) >> 1;
      if (a[p].f <= a[i].f) break;
      var t = a[p]; a[p] = a[i]; a[i] = t; i = p;
    }
  };
  Heap.prototype.pop = function () {
    var a = this.a;
    if (!a.length) return null;
    var top = a[0], last = a.pop();
    if (a.length) {
      a[0] = last;
      var i = 0;
      for (;;) {
        var l = 2 * i + 1, r = l + 1, m = i;
        if (l < a.length && a[l].f < a[m].f) m = l;
        if (r < a.length && a[r].f < a[m].f) m = r;
        if (m === i) break;
        var t = a[m]; a[m] = a[i]; a[i] = t; i = m;
      }
    }
    return top;
  };
  Heap.prototype.size = function () { return this.a.length; };

  /**
   * A* over snake configurations.
   * blocked: 1 = impassable FOR THIS CREATURE (void / rock / crate /
   *          wrong-colour gate / another creature). goals = mouth cells.
   */
  function snakeSearch(cols, rows, blocked, body, goals, nodeCap) {
    nodeCap = nodeCap || 250000;
    if (!goals.length) return { found: false, path: null, nodes: 0 };

    var goalSet = Object.create(null);
    for (var gi = 0; gi < goals.length; gi++) goalSet[goals[gi]] = 1;
    if (goalSet[body[0]]) return { found: true, path: [], nodes: 0 };

    var dist = buildDistanceField(cols, rows, blocked, goals);
    if (dist[body[0]] === 0x7fffffff) return { found: false, path: null, nodes: 0 };

    var open = new Heap();
    var seen = Object.create(null);
    var start = { body: body.slice(), g: 0, f: dist[body[0]], parent: null, dir: -1 };
    seen[keyOf(start.body)] = 0;
    open.push(start);
    var nodes = 0;

    while (open.size()) {
      var cur = open.pop();
      nodes++;
      if (nodes > nodeCap) return { found: false, path: null, nodes: nodes, capped: true };

      var head = cur.body[0];
      if (goalSet[head]) {
        var path = [], p = cur;
        while (p && p.dir >= 0) { path.push(p.dir); p = p.parent; }
        path.reverse();
        return { found: true, path: path, nodes: nodes };
      }

      var hc = head % cols, hr = (head - hc) / cols;
      for (var d = 0; d < 4; d++) {
        var nc = hc + DIRS[d].dc, nr = hr + DIRS[d].dr;
        if (nc < 0 || nr < 0 || nc >= cols || nr >= rows) continue;
        var ni = nc + nr * cols;
        if (blocked[ni]) continue;
        var self = false;
        for (var b = 0; b < cur.body.length; b++) { if (cur.body[b] === ni) { self = true; break; } }
        if (self) continue;
        if (dist[ni] === 0x7fffffff) continue;

        var nb = cur.body.slice();
        nb.unshift(ni); nb.pop();
        var k = keyOf(nb);
        var ng = cur.g + 1;
        if (seen[k] !== undefined && seen[k] <= ng) continue;
        seen[k] = ng;
        open.push({ body: nb, g: ng, f: ng + dist[ni], parent: cur, dir: d });
      }
    }
    return { found: false, path: null, nodes: nodes };
  }

  /** Every configuration a creature can reach within maxSteps. */
  function reachableConfigs(cols, rows, blocked, body, maxSteps, cap) {
    cap = cap || 3000;
    var out = [];
    var seen = Object.create(null);
    seen[keyOf(body)] = 1;
    var frontier = [{ body: body.slice(), path: [] }];
    for (var step = 0; step < maxSteps && out.length < cap; step++) {
      var next = [];
      for (var f = 0; f < frontier.length && out.length < cap; f++) {
        var cur = frontier[f];
        var head = cur.body[0];
        var hc = head % cols, hr = (head - hc) / cols;
        for (var d = 0; d < 4; d++) {
          var nc = hc + DIRS[d].dc, nr = hr + DIRS[d].dr;
          if (nc < 0 || nr < 0 || nc >= cols || nr >= rows) continue;
          var ni = nc + nr * cols;
          if (blocked[ni]) continue;
          var self = false;
          for (var b = 0; b < cur.body.length; b++) { if (cur.body[b] === ni) { self = true; break; } }
          if (self) continue;
          var nb = cur.body.slice();
          nb.unshift(ni); nb.pop();
          var k = keyOf(nb);
          if (seen[k]) continue;
          seen[k] = 1;
          var rec = { body: nb, path: cur.path.concat([d]) };
          next.push(rec);
          out.push(rec);
          if (out.length >= cap) break;
        }
      }
      if (!next.length) break;
      frontier = next;
    }
    return out;
  }

  function mouthsForColor(level, color) {
    var out = [];
    for (var i = 0; i < level.holes.length; i++) {
      if (level.holes[i].color !== color) continue;
      for (var m = 0; m < level.holes[i].mouths.length; m++) out.push(level.holes[i].mouths[m]);
    }
    return out;
  }

  /** Shared immutable context for all solver layers. */
  function solverContext(level) {
    var cols = level.cols, rows = level.rows, n = cols * rows;
    var N = level.creatures.length;
    var crateArr = level.crate || [];
    var gateArr = level.gate || [];
    var staticBlocked = new Uint8Array(n);
    for (var i = 0; i < n; i++) {
      staticBlocked[i] = (!level.region[i] || level.wall[i] || crateArr[i]) ? 1 : 0;
    }
    var byColor = {};
    function staticForColor(color) {
      if (byColor[color]) return byColor[color];
      var arr = staticBlocked.slice();
      for (var k = 0; k < n; k++) {
        if (gateArr[k] && gateArr[k] - 1 !== color) arr[k] = 1;
      }
      byColor[color] = arr;
      return arr;
    }
    return {
      level: level, cols: cols, rows: rows, n: n, N: N,
      staticBlocked: staticBlocked,
      staticForColor: staticForColor,
      goals: level.creatures.map(function (c) { return mouthsForColor(level, c.color); }),
      ice: level.creatures.map(function (c) { return c.ice || 0; }),
      colors: level.creatures.map(function (c) { return c.color; })
    };
  }

  /** Blocked field for creature `id` given everyone still present. */
  function blockedFor(ctx, id, bodies, present) {
    var arr = ctx.staticForColor(ctx.colors[id]).slice();
    for (var j = 0; j < ctx.N; j++) {
      if (j === id || !(present & (1 << j))) continue;
      var bj = bodies[j];
      for (var q = 0; q < bj.length; q++) arr[bj[q]] = 1;
    }
    return arr;
  }

  /**
   * Layer 2. Complete over solutions where no creature is moved except on its
   * way out. Returns { solvable, order, plans, branching, steps, exitableAtStart }.
   */
  function solveFast(ctx, opts) {
    opts = opts || {};
    var nodeCap = opts.nodeCap || 250000;
    var bodies = ctx.level.creatures.map(function (c) { return c.cells.slice(); });
    var canExitMemo = Object.create(null);
    var totalNodes = 0;

    function canExit(id, present) {
      // ice: frozen until `ice` other creatures have left
      var exitedCount = ctx.N - popcount(present);
      if (ctx.ice[id] > exitedCount) return null;
      var mk = id + '|' + present;
      var cached = canExitMemo[mk];
      if (cached !== undefined) return cached;
      var res = snakeSearch(ctx.cols, ctx.rows, blockedFor(ctx, id, bodies, present),
                            bodies[id], ctx.goals[id], nodeCap);
      totalNodes += res.nodes || 0;
      var out = res.found ? (res.path || []) : null;
      canExitMemo[mk] = out;
      return out;
    }
    function exitableAt(present) {
      var options = [];
      for (var id = 0; id < ctx.N; id++) {
        if (!(present & (1 << id))) continue;
        var path = canExit(id, present);
        if (path) options.push({ id: id, path: path });
      }
      return options;
    }

    var failed = Object.create(null);
    var order = [], plans = Object.create(null), branching = [];
    var full = (1 << ctx.N) - 1;

    function dfs(present) {
      if (present === 0) return true;
      if (failed[present]) return false;
      var options = exitableAt(present);
      if (!options.length) { failed[present] = 1; return false; }
      options.sort(function (a, b) { return a.path.length - b.path.length; });
      for (var k = 0; k < options.length; k++) {
        order.push(options[k].id);
        plans[options[k].id] = options[k].path;
        branching.push(options.length);
        if (dfs(present & ~(1 << options[k].id))) return true;
        branching.pop();
        order.pop();
        delete plans[options[k].id];
      }
      failed[present] = 1;
      return false;
    }

    var ok = ctx.N === 0 ? true : dfs(full);
    var steps = 0;
    if (ok) {
      for (var i = 0; i < order.length; i++) {
        steps += plans[order[i]].length + ctx.level.creatures[order[i]].cells.length;
      }
    }

    // Order rigidity, counted with the SAME memo - a second independent pass
    // over the mask lattice was the single most expensive thing in generation.
    var orderCount = 0;
    if (ok && opts.countOrders) {
      var cap = opts.orderCap || 24;
      (function countDfs(present) {
        if (orderCount >= cap) return;
        if (present === 0) { orderCount++; return; }
        for (var id = 0; id < ctx.N && orderCount < cap; id++) {
          if (!(present & (1 << id))) continue;
          if (!canExit(id, present)) continue;
          countDfs(present & ~(1 << id));
        }
      })(full);
    }

    return {
      solvable: ok,
      order: ok ? order.slice() : null,
      plans: ok ? plans : null,
      branching: ok ? branching.slice() : null,
      steps: steps, repositions: 0, nodes: totalNodes,
      orderCount: orderCount,
      exitableAtStart: exitableAt(full).length
    };
  }

  /**
   * Layer 3. Bounded "move a creature without exiting it" macro actions.
   * Returns { solvable, actions:[{kind:'exit'|'move', id, path}], repositions }.
   */
  function solveWithReposition(ctx, opts) {
    opts = opts || {};
    var budget = opts.repositionBudget === undefined ? 3 : opts.repositionBudget;
    var nodeCap = opts.nodeCap || 120000;
    // Repositioning episodes built by the generator are 2-5 steps long, so a
    // 10-step horizon is ample and keeps the config enumeration cheap. On a
    // densely packed board the reachable set is tiny anyway.
    var maxSteps = opts.repositionSteps || 10;
    var configCap = opts.configCap || 260;
    var stateCap = opts.stateCap || 12000;
    var branchCap = opts.repositionBranch || 14;
    var deadline = Date.now() + (opts.timeBudgetMs || 1200);

    var startBodies = ctx.level.creatures.map(function (c) { return c.cells.slice(); });
    var visited = Object.create(null);
    var states = 0;
    var actions = [];

    function stateKey(bodies, present) {
      var s = present + '|';
      for (var i = 0; i < ctx.N; i++) {
        if (!(present & (1 << i))) continue;
        s += i + ':' + keyOf(bodies[i]) + ';';
      }
      return s;
    }
    function exitOptions(bodies, present) {
      var out = [];
      var exitedCount = ctx.N - popcount(present);
      for (var id = 0; id < ctx.N; id++) {
        if (!(present & (1 << id))) continue;
        if (ctx.ice[id] > exitedCount) continue;
        var res = snakeSearch(ctx.cols, ctx.rows, blockedFor(ctx, id, bodies, present),
                              bodies[id], ctx.goals[id], nodeCap);
        if (res.found) out.push({ id: id, path: res.path || [] });
      }
      out.sort(function (a, b) { return a.path.length - b.path.length; });
      return out;
    }

    function search(bodies, present, repoLeft) {
      if (present === 0) return true;
      if (++states > stateCap) return false;
      if ((states & 63) === 0 && Date.now() > deadline) return false;
      var key = stateKey(bodies, present);
      if (visited[key]) return false;
      visited[key] = 1;

      var exits = exitOptions(bodies, present);
      for (var i = 0; i < exits.length; i++) {
        actions.push({ kind: 'exit', id: exits[i].id, path: exits[i].path });
        if (search(bodies, present & ~(1 << exits[i].id), repoLeft)) return true;
        actions.pop();
      }
      if (repoLeft <= 0) return false;

      var exitedCount = ctx.N - popcount(present);
      var candidates = [];
      for (var y = 0; y < ctx.N; y++) {
        if (!(present & (1 << y))) continue;
        if (ctx.ice[y] > exitedCount) continue;
        var blocked = blockedFor(ctx, y, bodies, present);
        var cfgs = reachableConfigs(ctx.cols, ctx.rows, blocked, bodies[y], maxSteps, configCap);
        for (var c = 0; c < cfgs.length; c++) {
          var vacated = 0;
          for (var q = 0; q < bodies[y].length; q++) {
            if (cfgs[c].body.indexOf(bodies[y][q]) < 0) vacated++;
          }
          if (!vacated) continue;
          candidates.push({ id: y, body: cfgs[c].body, path: cfgs[c].path, vacated: vacated });
        }
      }
      candidates.sort(function (a, b) {
        return (b.vacated - a.vacated) || (a.path.length - b.path.length);
      });
      for (var k = 0; k < candidates.length && k < branchCap; k++) {
        var cand = candidates[k];
        var nb = bodies.slice();
        nb[cand.id] = cand.body;
        actions.push({ kind: 'move', id: cand.id, path: cand.path });
        if (search(nb, present, repoLeft - 1)) return true;
        actions.pop();
      }
      return false;
    }

    for (var b = 1; b <= budget; b++) {
      visited = Object.create(null);
      states = 0;
      actions = [];
      if (search(startBodies, (1 << ctx.N) - 1, b)) {
        var repos = actions.filter(function (a) { return a.kind === 'move'; }).length;
        var steps = 0;
        actions.forEach(function (a) {
          steps += a.path.length;
          if (a.kind === 'exit') steps += ctx.level.creatures[a.id].cells.length;
        });
        return { solvable: true, actions: actions.slice(), repositions: repos, steps: steps, states: states };
      }
    }
    return { solvable: false, actions: null, repositions: 0, steps: 0, states: states };
  }

  /**
   * Public solver. Tries the fast (no-repositioning) search first and only
   * escalates when that proves repositioning is genuinely required.
   */
  function solveLevel(level, opts) {
    opts = opts || {};
    var ctx = opts._ctx || solverContext(level);
    var fast = solveFast(ctx, opts);
    if (fast.solvable) { fast.mode = 'direct'; return fast; }
    if (opts.fastOnly) { fast.mode = 'direct'; return fast; }
    if (opts.allowReposition === false) { fast.mode = 'direct'; return fast; }
    var deep = solveWithReposition(ctx, opts);
    if (!deep.solvable) {
      return { solvable: false, order: null, plans: null, steps: 0, repositions: 0,
               mode: 'reposition', nodes: fast.nodes, exitableAtStart: fast.exitableAtStart };
    }
    var order = deep.actions.filter(function (a) { return a.kind === 'exit'; }).map(function (a) { return a.id; });
    return {
      solvable: true, mode: 'reposition',
      order: order, plans: null, actions: deep.actions,
      steps: deep.steps, repositions: deep.repositions,
      branching: null, nodes: fast.nodes, states: deep.states,
      exitableAtStart: fast.exitableAtStart
    };
  }

  /** Count distinct valid exit orders (no repositioning), capped. */
  function countExitOrders(ctx, cap, nodeCap) {
    cap = cap || 48;
    var bodies = ctx.level.creatures.map(function (c) { return c.cells.slice(); });
    var memo = Object.create(null);
    var found = 0;
    function canExit(id, present) {
      var exitedCount = ctx.N - popcount(present);
      if (ctx.ice[id] > exitedCount) return false;
      var mk = id + '|' + present;
      if (memo[mk] !== undefined) return memo[mk];
      var res = snakeSearch(ctx.cols, ctx.rows, blockedFor(ctx, id, bodies, present),
                            bodies[id], ctx.goals[id], nodeCap || 120000);
      memo[mk] = res.found;
      return res.found;
    }
    function dfs(present) {
      if (found >= cap) return;
      if (present === 0) { found++; return; }
      for (var id = 0; id < ctx.N && found < cap; id++) {
        if (!(present & (1 << id))) continue;
        if (!canExit(id, present)) continue;
        dfs(present & ~(1 << id));
      }
    }
    dfs((1 << ctx.N) - 1);
    return found;
  }

  // =====================================================================
  // DIFFICULTY MEASUREMENT
  // =====================================================================

  var DIFF_WEIGHTS = { free: 30, branch: 26, blocked: 14, obstacles: 10, count: 10, maneuver: 6, rigidity: 4 };

  /**
   * Measure how hard a level actually is. Every input comes from the
   * INDEPENDENT solver - nothing here consults the generator's build record.
   */
  function analyzeLevel(level, opts) {
    opts = opts || {};
    var ctx = solverContext(level);
    var n = level.cols * level.rows;
    var crateArr = level.crate || [], gateArr = level.gate || [];

    var playable = 0, rocks = 0, crates = 0, gates = 0;
    for (var i = 0; i < n; i++) {
      if (!level.region[i]) continue;
      if (level.wall[i]) { rocks++; continue; }
      if (crateArr[i]) { crates++; continue; }
      playable++;
      if (gateArr[i]) gates++;
    }
    var occupied = 0, iceCount = 0, iceTotal = 0;
    level.creatures.forEach(function (c) {
      occupied += c.cells.length;
      if (c.ice > 0) { iceCount++; iceTotal += c.ice; }
    });
    var freeCells = playable - occupied;
    var freeRatio = playable > 0 ? freeCells / playable : 1;

    var sol = solveLevel(level, {
      _ctx: ctx,
      nodeCap: opts.nodeCap || 250000,
      countOrders: !opts.skipOrderCount,
      orderCap: opts.orderCap || 24,
      repositionBudget: opts.repositionBudget === undefined ? 3 : opts.repositionBudget
    });
    if (!sol.solvable) {
      return { solvable: false, score: 0, label: 'UNSOLVABLE', freeRatio: freeRatio,
               playable: playable, freeCells: freeCells, creatures: ctx.N,
               obstacles: { rocks: rocks, crates: crates, gates: gates, ice: iceCount, iceTotal: iceTotal } };
    }

    var avgBranch;
    if (sol.branching && sol.branching.length) {
      var s = 0;
      for (var b = 0; b < sol.branching.length; b++) s += sol.branching[b];
      avgBranch = s / sol.branching.length;
    } else {
      avgBranch = 1;      // needing repositioning means the order is fully forced
    }

    var exitableAtStart = sol.exitableAtStart;
    var blockedAtStart = ctx.N - exitableAtStart;
    var orderCount = opts.skipOrderCount ? 1
      : (sol.mode === 'reposition' ? 1 : Math.max(1, sol.orderCount || 1));
    var maneuverDepth = sol.repositions || 0;
    var solutionLength = sol.steps;

    var sFree     = clamp((0.45 - freeRatio) / 0.40, 0, 1) * DIFF_WEIGHTS.free;
    var sBranch   = clamp((5 - avgBranch) / 4, 0, 1) * DIFF_WEIGHTS.branch;
    var sBlocked  = clamp(blockedAtStart / Math.max(1, ctx.N - 1), 0, 1) * DIFF_WEIGHTS.blocked;
    var obsScore  = rocks + crates * 1.15 + gates * 2.4 + iceTotal * 1.9;
    var sObs      = clamp(obsScore / 20, 0, 1) * DIFF_WEIGHTS.obstacles;
    var sCount    = clamp((ctx.N - 3) / 10, 0, 1) * DIFF_WEIGHTS.count;
    var sManeuver = clamp(maneuverDepth / 3, 0, 1) * DIFF_WEIGHTS.maneuver;
    var rigidCap = Math.max(2, opts.orderCap || 24);
    var sRigid    = clamp(1 - Math.log(Math.max(1, orderCount)) / Math.log(rigidCap), 0, 1) * DIFF_WEIGHTS.rigidity;
    var score = Math.round(sFree + sBranch + sBlocked + sObs + sCount + sManeuver + sRigid);

    return {
      solvable: true, score: score, label: difficultyLabel(score),
      freeRatio: freeRatio, freeCells: freeCells, playable: playable,
      creatures: ctx.N, avgBranch: avgBranch,
      blockedAtStart: blockedAtStart, exitableAtStart: exitableAtStart,
      maneuverDepth: maneuverDepth, solutionLength: solutionLength,
      orderCount: orderCount, mode: sol.mode,
      obstacles: { rocks: rocks, crates: crates, gates: gates, ice: iceCount, iceTotal: iceTotal },
      parts: { free: sFree, branch: sBranch, blocked: sBlocked, obstacles: sObs,
               count: sCount, maneuver: sManeuver, rigidity: sRigid }
    };
  }

  function difficultyLabel(score) {
    if (score < 35) return 'EASY';
    if (score < 60) return 'MEDIUM';
    if (score < 80) return 'HARD';
    return 'VERY HARD';
  }

  // =====================================================================
  // LIVE-STATE HELPERS (hint / bot)
  // =====================================================================

  function liveBlockedFor(game, id) {
    var n = game.cols * game.rows;
    var cr = game.creatures[id];
    var blocked = new Uint8Array(n);
    for (var i = 0; i < n; i++) {
      blocked[i] = (game.blockedStatic[i] || (game.gate[i] && game.gate[i] - 1 !== cr.color)) ? 1 : 0;
    }
    for (var j = 0; j < game.creatures.length; j++) {
      var o = game.creatures[j];
      if (o.id === id || o.exited) continue;
      for (var q = 0; q < o.cells.length; q++) blocked[o.cells[q]] = 1;
    }
    return blocked;
  }

  function findExitPath(game, id, nodeCap) {
    var cr = game.creatures[id];
    if (!cr || cr.exited || cr.ice > 0) return null;
    var goals = [];
    for (var h = 0; h < game.holes.length; h++) {
      if (game.holes[h].color !== cr.color) continue;
      for (var m = 0; m < game.holes[h].mouths.length; m++) goals.push(game.holes[h].mouths[m]);
    }
    var res = snakeSearch(game.cols, game.rows, liveBlockedFor(game, id), cr.cells, goals, nodeCap || 120000);
    return res.found ? { id: id, path: res.path } : null;
  }

  function findHint(game, nodeCap) {
    var best = null;
    for (var i = 0; i < game.creatures.length; i++) {
      if (game.creatures[i].exited) continue;
      var p = findExitPath(game, i, nodeCap);
      if (p && (!best || p.path.length < best.path.length)) best = p;
    }
    return best;
  }

  function holeDirFromHead(game, id) {
    var cr = game.creatures[id];
    if (!cr || !cr.cells.length) return -1;
    var head = cr.cells[0];
    var hc = game.colOf(head), hr = game.rowOf(head);
    for (var d = 0; d < 4; d++) {
      var nc = hc + DIRS[d].dc, nr = hr + DIRS[d].dr;
      if (!game.inBounds(nc, nr)) continue;
      var hid = game.holeAt[game.idx(nc, nr)];
      if (hid >= 0 && game.holes[hid].color === cr.color) return d;
    }
    return -1;
  }

  // =====================================================================
  // LEVEL GENERATION
  // =====================================================================

  var TIER_COUNT = 6;

  function tierOf(level) {
    var L = Math.max(1, Math.floor(level));
    if (L <= 4) return 0;
    if (L <= 12) return 1;
    if (L <= 25) return 2;
    if (L <= 50) return 3;
    if (L <= 100) return 4;
    return 5;
  }

  var TIER_SPANS = [[1, 4], [5, 12], [13, 25], [26, 50], [51, 100], [101, 200]];
  var BAND_MIN   = [[0, 10], [22, 32], [38, 50], [54, 64], [64, 70], [70, 78]];
  var BAND_MAX   = [[20, 30], [42, 52], [58, 70], [74, 84], [86, 95], [95, 99]];

  /**
   * The measured-score band a generated level must land in. It ramps
   * CONTINUOUSLY inside each tier, so level 50 is required to be harder than
   * level 30 even though both sit in tier 3.
   */
  function difficultyBand(level) {
    var t = tierOf(level);
    var span = TIER_SPANS[t];
    var p = clamp((Math.max(1, Math.floor(level)) - span[0]) / Math.max(1, span[1] - span[0]), 0, 1);
    return {
      min: Math.round(BAND_MIN[t][0] + (BAND_MIN[t][1] - BAND_MIN[t][0]) * p),
      max: Math.round(BAND_MAX[t][0] + (BAND_MAX[t][1] - BAND_MAX[t][0]) * p)
    };
  }

  function levelConfig(level) {
    var L = Math.max(1, Math.floor(level));
    var tier = tierOf(L);
    var span = TIER_SPANS[tier];
    var p = clamp((L - span[0]) / Math.max(1, span[1] - span[0]), 0, 1);

    var PLAY   = [[6, 7], [6, 9], [7, 10], [8, 11], [9, 12], [9, 13]][tier];
    var FREE   = [[0.46, 0.40], [0.34, 0.26], [0.23, 0.16], [0.15, 0.11], [0.10, 0.075], [0.075, 0.06]][tier];
    var CREAT  = [[3, 4], [5, 6], [6, 8], [8, 11], [11, 13], [13, 13]][tier];
    // longer bodies are the main lever for packing density at high tiers
    var LEN    = [[3, 4], [3, 6], [3, 7], [4, 7], [4, 8], [4, 8]][tier];
    var ROCKS  = [[0, 0], [1, 3], [2, 5], [4, 7], [5, 9], [9, 12]][tier];
    var CRATES = [[0, 0], [0, 1], [1, 3], [2, 5], [3, 7], [7, 9]][tier];
    // extra rocks the densification pass may drop into unused pockets
    var FILLR  = [[0, 0], [0, 1], [1, 3], [2, 5], [3, 7], [7, 9]][tier];
    var ICE    = [[0, 0], [0, 1], [1, 3], [2, 4], [3, 5], [5, 6]][tier];
    var GATES  = [[0, 0], [0, 0], [0, 2], [1, 3], [2, 4], [4, 5]][tier];
    var REPOS  = [[0, 0], [0, 1], [1, 2], [2, 3], [2, 4], [4, 4]][tier];
    var IRREG  = [0.03, 0.07, 0.09, 0.10, 0.11, 0.12][tier];
    var REGFILL= [0.93, 0.92, 0.90, 0.88, 0.87, 0.86];

    function lerpI(pair) { return Math.round(pair[0] + (pair[1] - pair[0]) * p); }

    var creatureCount = lerpI(CREAT);
    return {
      level: L, tier: tier, p: p,
      cols: PLAY[0] + 2, rows: PLAY[1] + 2,
      playCols: PLAY[0], playRows: PLAY[1],
      regionFill: REGFILL[tier],
      irregularity: IRREG,
      targetFree: FREE[0] + (FREE[1] - FREE[0]) * p,
      creatureCount: creatureCount,
      // the tutorial tier is capped hard; later tiers may pack in extras until
      // the free-space target is met
      maxCreatures: tier === 0 ? creatureCount + 2 : 13,
      minLen: LEN[0], maxLen: LEN[1],
      rocks: lerpI(ROCKS), crates: lerpI(CRATES), fillRocks: lerpI(FILLR),
      iceCreatures: lerpI(ICE), gates: lerpI(GATES),
      repositionEpisodes: lerpI(REPOS),
      minK: tier === 0 ? 2 : 3,
      maxK: 4 + Math.round(p * 5) + tier,
      band: difficultyBand(L),
      seed: (L * 2654435761) >>> 0
    };
  }

  function neighborsOf(i, cols, rows) {
    var c = i % cols, r = (i - c) / cols;
    var out = [];
    for (var d = 0; d < 4; d++) {
      var nc = c + DIRS[d].dc, nr = r + DIRS[d].dr;
      if (nc < 0 || nr < 0 || nc >= cols || nr >= rows) continue;
      out.push(nc + nr * cols);
    }
    return out;
  }
  function countRegionNeighbors(i, reg, cols, rows) {
    var ns = neighborsOf(i, cols, rows), k = 0;
    for (var q = 0; q < ns.length; q++) if (reg[ns[q]]) k++;
    return k;
  }
  function connectedCount(free, cols, rows, startIdx) {
    var seen = new Uint8Array(free.length);
    var q = [startIdx], qh = 0, k = 0;
    seen[startIdx] = 1;
    while (qh < q.length) {
      var cur = q[qh++]; k++;
      var ns = neighborsOf(cur, cols, rows);
      for (var i = 0; i < ns.length; i++) {
        if (!free[ns[i]] || seen[ns[i]]) continue;
        seen[ns[i]] = 1; q.push(ns[i]);
      }
    }
    return k;
  }
  function isConnected(mask, cols, rows) {
    var first = -1, total = 0;
    for (var i = 0; i < mask.length; i++) if (mask[i]) { if (first < 0) first = i; total++; }
    if (first < 0) return true;
    return connectedCount(mask, cols, rows, first) === total;
  }

  /**
   * Irregular jigsaw playable region: a compact blob, bitten into around the
   * perimeter to make notches, alcoves and one-cell corridors.
   */
  function growRegion(rng, cfg) {
    var cols = cfg.cols, rows = cfg.rows;
    var reg = new Uint8Array(cols * rows);
    var x0 = 1, y0 = 1, w = cfg.playCols, h = cfg.playRows;
    function inWin(i) {
      var c = i % cols, r = (i - c) / cols;
      return c >= x0 && r >= y0 && c < x0 + w && r < y0 + h;
    }
    var target = Math.round(w * h * cfg.regionFill);
    var seed = (x0 + (w >> 1)) + (y0 + (h >> 1)) * cols;
    reg[seed] = 1;
    var count = 1;

    while (count < target) {
      var cands = Object.create(null);
      for (var i = 0; i < reg.length; i++) {
        if (!reg[i]) continue;
        var ns = neighborsOf(i, cols, rows);
        for (var q = 0; q < ns.length; q++) {
          var ni = ns[q];
          if (reg[ni] || !inWin(ni)) continue;
          cands[ni] = (cands[ni] || 0) + 1;
        }
      }
      var keys = Object.keys(cands);
      if (!keys.length) break;
      var total = 0, weights = [];
      for (var k = 0; k < keys.length; k++) {
        var wgt = Math.pow(cands[keys[k]], 3) + 0.35;
        weights.push(wgt); total += wgt;
      }
      var pick = rng() * total, acc = 0, chosen = keys[keys.length - 1];
      for (var k2 = 0; k2 < keys.length; k2++) {
        acc += weights[k2];
        if (pick <= acc) { chosen = keys[k2]; break; }
      }
      reg[chosen | 0] = 1;
      count++;
    }

    for (var pass = 0; pass < 2; pass++) {
      for (var a = 0; a < reg.length; a++) {
        if (reg[a] || !inWin(a)) continue;
        if (countRegionNeighbors(a, reg, cols, rows) >= 3) { reg[a] = 1; count++; }
      }
    }

    // carve jigsaw bites out of the perimeter -> alcoves and narrow corridors
    var bites = Math.round(count * cfg.irregularity);
    var guard = 0;
    while (bites > 0 && guard++ < 400) {
      var edge = [];
      for (var e = 0; e < reg.length; e++) {
        if (!reg[e]) continue;
        if (countRegionNeighbors(e, reg, cols, rows) < 4) edge.push(e);
      }
      if (!edge.length) break;
      var cell = edge[Math.floor(rng() * edge.length)];
      reg[cell] = 0;
      if (!isConnected(reg, cols, rows)) { reg[cell] = 1; continue; }
      count--; bites--;
    }

    // shave dead-end nubs (removing a leaf can never disconnect the rest)
    for (var pass2 = 0; pass2 < 2; pass2++) {
      for (var b2 = 0; b2 < reg.length; b2++) {
        if (!reg[b2]) continue;
        if (countRegionNeighbors(b2, reg, cols, rows) <= 1) { reg[b2] = 0; count--; }
      }
    }
    return { reg: reg, count: count };
  }

  /** Rocks that PINCH the board (interior first) rather than scatter. */
  function placeRocks(rng, cfg, reg, wantRocks) {
    var cols = cfg.cols, rows = cfg.rows;
    var wall = new Uint8Array(cols * rows);
    var free = Uint8Array.from(reg);
    var cands = [];
    for (var i = 0; i < reg.length; i++) if (reg[i]) cands.push(i);
    shuffleInPlace(cands, rng);
    cands.sort(function (a, b) {
      return countRegionNeighbors(b, reg, cols, rows) - countRegionNeighbors(a, reg, cols, rows);
    });
    var placed = 0;
    for (var k = 0; k < cands.length && placed < wantRocks; k++) {
      var idx = Math.min(cands.length - 1, k + Math.floor(rng() * 3));
      var cell = cands[idx];
      if (wall[cell]) continue;
      free[cell] = 0;
      if (!isConnected(free, cols, rows)) { free[cell] = 1; continue; }
      wall[cell] = 1; placed++;
    }
    return { wall: wall, placed: placed };
  }

  // ------------------------------------------------------ backward timeline
  //
  // The WHOLE solution is simulated backwards from "every creature already
  // exited". Two reversible actions:
  //
  //   reverse-feed X : X grows one cell out of its hole   (forward: X feeds in)
  //   reverse-move X : X's head cell is released and a new tail cell claimed
  //                    (forward: X's head steps into the released cell)
  //
  // Every backward step only claims cells that are free at that moment, so
  // replaying the reversed action list forwards is legal move-for-move.
  //
  // Interleaving a reverse-move of an EARLIER-materialised creature after a
  // later one exists yields a forward REPOSITIONING move: that creature must
  // shuffle out of the way before the other one can leave. This is what
  // produces genuine maneuver depth.

  function Timeline(cfg, blocked) {
    this.cfg = cfg;
    this.cols = cfg.cols; this.rows = cfg.rows;
    this.blocked = blocked;
    this.occ = new Int16Array(cfg.cols * cfg.rows);
    for (var i = 0; i < this.occ.length; i++) this.occ[i] = -1;
    this.bodies = [];
    this.actions = [];                        // backward order
    this.touched = Object.create(null);
    this.traversedBy = Object.create(null);
  }
  Timeline.prototype.isFree = function (cell) {
    return !this.blocked[cell] && this.occ[cell] < 0;
  };
  Timeline.prototype._mark = function (cell, color) {
    this.touched[cell] = 1;
    if (!this.traversedBy[cell]) this.traversedBy[cell] = {};
    this.traversedBy[cell][color] = 1;
  };
  Timeline.prototype.freeNeighbors = function (cell) {
    var out = [], ns = neighborsOf(cell, this.cols, this.rows);
    for (var i = 0; i < ns.length; i++) if (this.isFree(ns[i])) out.push(ns[i]);
    return out;
  };
  Timeline.prototype.materialise = function (rng, id, color, mouth, len) {
    if (!this.isFree(mouth)) return false;
    var self = this;
    var body = [mouth];
    this.occ[mouth] = id;
    for (var s = 1; s < len; s++) {
      var cands = this.freeNeighbors(body[body.length - 1]);
      if (!cands.length) {
        for (var q = 0; q < body.length; q++) this.occ[body[q]] = -1;
        return false;
      }
      shuffleInPlace(cands, rng);
      cands.sort(function (a, b) { return self.freeNeighbors(b).length - self.freeNeighbors(a).length; });
      var next = cands[Math.floor(rng() * Math.min(2, cands.length))];
      body.push(next);
      this.occ[next] = id;
    }
    for (var m = 0; m < body.length; m++) this._mark(body[m], color);
    this.bodies[id] = body;
    this.actions.push({ kind: 'feed', id: id, count: len, mouth: mouth });
    return true;
  };
  Timeline.prototype.reverseMove = function (rng, id, color) {
    var body = this.bodies[id];
    if (!body || body.length < 2) return false;
    var headCell = body[0];
    var cands = this.freeNeighbors(body[body.length - 1]);   // headCell still occupied -> excluded
    if (!cands.length) return false;
    var self = this;
    shuffleInPlace(cands, rng);
    cands.sort(function (a, b) { return self.freeNeighbors(b).length - self.freeNeighbors(a).length; });
    var t = cands[Math.floor(rng() * Math.min(2, cands.length))];
    this.occ[headCell] = -1;
    body.shift();
    body.push(t);
    this.occ[t] = id;
    this._mark(t, color);
    this.actions.push({ kind: 'move', id: id, target: headCell });
    return true;
  };
  Timeline.prototype.forwardPlan = function () {
    var fwd = [];
    for (var i = this.actions.length - 1; i >= 0; i--) fwd.push(this.actions[i]);
    return fwd;
  };
  /** Exits completed before each creature's FIRST forward action = safe ice cap. */
  Timeline.prototype.iceBudget = function (ids) {
    var fwd = this.forwardPlan();
    var exited = 0;
    var budget = {};
    ids.forEach(function (id) { budget[id] = -1; });
    for (var i = 0; i < fwd.length; i++) {
      var a = fwd[i];
      if (budget[a.id] !== undefined && budget[a.id] < 0) budget[a.id] = exited;
      if (a.kind === 'feed') exited++;
    }
    ids.forEach(function (id) { if (budget[id] < 0) budget[id] = 0; });
    return budget;
  };
  Timeline.prototype.undoCreature = function (id) {
    var body = this.bodies[id];
    if (!body) return;
    for (var i = 0; i < body.length; i++) this.occ[body[i]] = -1;
    this.bodies[id] = null;
    while (this.actions.length && this.actions[this.actions.length - 1].id === id) this.actions.pop();
  };

  function tryGenerate(cfg, rng) {
    var cols = cfg.cols, rows = cfg.rows, n = cols * rows;

    // ---- 1. irregular board
    var grown = growRegion(rng, cfg);
    var reg = grown.reg;
    if (grown.count < cfg.creatureCount * cfg.minLen + 6) return null;
    if (!isConnected(reg, cols, rows)) return null;

    // ---- 2. rocks pinch corridors
    var rockRes = placeRocks(rng, cfg, reg, cfg.rocks);
    var wall = rockRes.wall;

    var blocked = new Uint8Array(n);
    var playableCells = 0;
    for (var b = 0; b < n; b++) {
      blocked[b] = (!reg[b] || wall[b]) ? 1 : 0;
      if (reg[b] && !wall[b]) playableCells++;
    }

    // ---- 3. border holes
    var holeCands = [];
    for (var hcI = 0; hcI < n; hcI++) {
      if (reg[hcI]) continue;
      var mouths = neighborsOf(hcI, cols, rows).filter(function (x) { return reg[x] && !wall[x]; });
      if (!mouths.length) continue;
      holeCands.push({ index: hcI, c: hcI % cols, r: (hcI - (hcI % cols)) / cols, mouths: mouths });
    }
    if (holeCands.length < cfg.creatureCount) return null;

    // ---- 4. backward timeline (also drives packing density)
    var tl = new Timeline(cfg, blocked);
    var holes = [], creatures = [];
    var usedHole = Object.create(null);
    var occupiedCells = 0, placed = 0, repositionsMade = 0;
    var targetOccupied = playableCells * (1 - cfg.targetFree);
    var FLOOR_LEN = 3;   // absolute shortest body the packer may fall back to

    for (var ci = 0; ci < cfg.maxCreatures; ci++) {
      if (placed >= cfg.creatureCount &&
          (playableCells - occupiedCells) / playableCells <= cfg.targetFree) break;

      var color = ci % COLOR_COUNT;
      var freeFrac = (playableCells - occupiedCells) / playableCells;
      // Body length is chosen so that `creatureCount` bodies land exactly on the
      // packing target - drawing from [minLen,maxLen] instead makes the first
      // few creatures eat the whole board and starves the rest.
      var avgLen = clamp(targetOccupied / Math.max(1, cfg.creatureCount), cfg.minLen, cfg.maxLen);
      // Monotonically decreasing schedule: long bodies first (while they still
      // fit), short ones last. The sum still lands on the packing target, but
      // far more of the requested length actually gets placed.
      var frac = placed / Math.max(1, cfg.creatureCount);
      var len = clamp(Math.round(avgLen * (1.35 - 0.75 * clamp(frac, 0, 1)) + (rng() - 0.5)),
                      FLOOR_LEN, cfg.maxLen);
      var kHi = freeFrac > 0.35 ? cfg.maxK : freeFrac > 0.22 ? Math.max(cfg.minK, cfg.maxK - 3) : cfg.minK;
      var wantK = cfg.minK + Math.floor(rng() * Math.max(1, kHi - cfg.minK + 1));
      var minMoved = (cfg.tier === 0) ? 2 : (freeFrac > 0.35 ? 3 : freeFrac > 0.20 ? 2 : 1);
      var cands = shuffleInPlace(holeCands.slice(), rng);
      var done = false;

      for (var a2 = 0; a2 < cands.length && !done; a2++) {
        var hc = cands[a2];
        if (usedHole[hc.index]) continue;
        var liveMouths = shuffleInPlace(hc.mouths.filter(function (m) { return tl.isFree(m); }), rng);
        for (var mi = 0; mi < liveMouths.length && !done; mi++) {
          for (var tryLen = len; tryLen >= FLOOR_LEN && !done; tryLen--) {
            if (!tl.materialise(rng, ci, color, liveMouths[mi], tryLen)) continue;
            var moved = 0;
            for (var k2 = 0; k2 < wantK; k2++) {
              if (!tl.reverseMove(rng, ci, color)) break;
              moved++;
            }
            if (moved < minMoved) { tl.undoCreature(ci); continue; }
            usedHole[hc.index] = 1;
            holes.push({
              id: holes.length, color: color, c: hc.c, r: hc.r, index: hc.index,
              mouths: hc.mouths.slice(),
              facing: facingOf(hc.c, hc.r, liveMouths[mi], cols)
            });
            creatures.push({ id: ci, color: color, holeId: holes.length - 1 });
            occupiedCells += tryLen;
            placed++;
            done = true;
          }
        }
      }
      // could not fit another one: retry a couple of times with the smallest
      // possible body before conceding, then stop packing (never discard the
      // board - the difficulty measurement decides whether to keep it)
      if (!done) {
        var rescued = false;
        for (var rt = 0; rt < 3 && !rescued; rt++) {
          var rcands = shuffleInPlace(holeCands.slice(), rng);
          for (var rc = 0; rc < rcands.length && !rescued; rc++) {
            if (usedHole[rcands[rc].index]) continue;
            var rm = shuffleInPlace(rcands[rc].mouths.filter(function (m) { return tl.isFree(m); }), rng);
            for (var rmi = 0; rmi < rm.length && !rescued; rmi++) {
              if (!tl.materialise(rng, ci, color, rm[rmi], FLOOR_LEN)) continue;
              if (!tl.reverseMove(rng, ci, color)) { tl.undoCreature(ci); continue; }
              usedHole[rcands[rc].index] = 1;
              holes.push({
                id: holes.length, color: color, c: rcands[rc].c, r: rcands[rc].r,
                index: rcands[rc].index, mouths: rcands[rc].mouths.slice(),
                facing: facingOf(rcands[rc].c, rcands[rc].r, rm[rmi], cols)
              });
              creatures.push({ id: ci, color: color, holeId: holes.length - 1 });
              occupiedCells += FLOOR_LEN;
              placed++;
              rescued = true;
            }
          }
        }
        if (!rescued) break;
      }

      // ---- 5. repositioning episode: shuffle an EARLIER creature now that a
      //         later one exists -> forward, it must move aside first.
      if (repositionsMade < cfg.repositionEpisodes && placed >= 2 && rng() < 0.7) {
        var vi = Math.floor(rng() * (placed - 1));
        var did = 0, steps = 2 + Math.floor(rng() * 3);
        for (var s2 = 0; s2 < steps; s2++) {
          if (!tl.reverseMove(rng, creatures[vi].id, creatures[vi].color)) break;
          did++;
        }
        if (did >= 2) repositionsMade++;
      }
    }

    if (placed < Math.max(3, Math.ceil(cfg.creatureCount * 0.7))) return null;
    creatures.forEach(function (c) { c.cells = tl.bodies[c.id].slice(); });

    // ---- 6. densification: crates/rocks fill pockets the solution NEVER uses,
    //         so the construction proof still holds.
    var crate = new Uint8Array(n);
    var gate = new Uint8Array(n);
    var untouched = [];
    for (var u = 0; u < n; u++) {
      if (!reg[u] || wall[u]) continue;
      if (tl.occ[u] >= 0 || tl.touched[u]) continue;
      untouched.push(u);
    }
    shuffleInPlace(untouched, rng);

    var occNow = 0;
    creatures.forEach(function (c) { occNow += c.cells.length; });
    // solve (playable - fill - occNow) / (playable - fill) = targetFree
    var fillExact = Math.round((playableCells - occNow - cfg.targetFree * playableCells) /
                               Math.max(0.0001, 1 - cfg.targetFree));
    var fillBudget = cfg.crates + cfg.fillRocks;
    var fill = clamp(fillExact, 0, Math.min(untouched.length, fillBudget));
    var crateBudget = Math.min(cfg.crates, fill);
    for (var uu = 0; uu < fill; uu++) {
      if (uu < crateBudget) crate[untouched[uu]] = (uu % COLOR_COUNT) + 1;
      else wall[untouched[uu]] = 1;
    }
    var obstaclesPlaced = fill;

    // ---- 6b. SPECULATIVE DENSIFICATION.
    // Filling only never-visited pockets rarely reaches the packing target,
    // because the backward timeline touches most of the board. So keep going
    // into cells the solution DOES use, and verify after each batch: a batch
    // that breaks solvability is rolled straight back out. This is what gets
    // the high tiers from ~15% free down to ~8-10%.
    // The tutorial tier is contractually obstacle-free, and no tier may exceed
    // its obstacle allowance just because the packer left gaps.
    var extraCap = cfg.tier === 0 ? 0 : (cfg.crates + cfg.fillRocks + 8);
    var stillShort = Math.min(fillExact - fill, Math.max(0, extraCap - fill));
    if (stillShort > 0) {
      var risky = [];
      for (var rv = 0; rv < n; rv++) {
        if (!reg[rv] || wall[rv] || crate[rv]) continue;
        if (tl.occ[rv] >= 0) continue;              // a body sits there
        risky.push(rv);
      }
      shuffleInPlace(risky, rng);
      var probe = { level: cfg.level, cols: cols, rows: rows,
                    region: Array.prototype.slice.call(reg),
                    wall: null, crate: null, gate: Array.prototype.slice.call(gate),
                    holes: holes, creatures: null };
      var applied = 0;
      for (var round = 0; round < 5 && applied < stillShort && risky.length; round++) {
        var batch = Math.max(1, Math.ceil((stillShort - applied) / (round === 0 ? 1 : 3)));
        batch = Math.min(batch, risky.length);
        var taken = risky.slice(0, batch);
        var trialWall = Uint8Array.from(wall), trialCrate = Uint8Array.from(crate);
        for (var tk = 0; tk < taken.length; tk++) {
          if ((obstaclesPlaced + applied + tk) % 3 === 0 && (obstaclesPlaced + applied + tk) < cfg.crates + cfg.fillRocks + 8) {
            trialCrate[taken[tk]] = ((tk + 3) % COLOR_COUNT) + 1;
          } else {
            trialWall[taken[tk]] = 1;
          }
        }
        probe.wall = Array.prototype.slice.call(trialWall);
        probe.crate = Array.prototype.slice.call(trialCrate);
        probe.creatures = creatures.map(function (c, i) {
          return { id: i, color: c.color, holeId: c.holeId, cells: c.cells.slice(), ice: 0 };
        });
        // holes must still touch the board
        var mouthsOk = true;
        for (var hm = 0; hm < holes.length; hm++) {
          var live = holes[hm].mouths.filter(function (m) { return !trialWall[m] && !trialCrate[m]; });
          if (!live.length) { mouthsOk = false; break; }
        }
        var ok = false;
        if (mouthsOk) {
          try {
            var probeLevel = {
              level: cfg.level, tier: cfg.tier, cols: cols, rows: rows,
              region: probe.region, wall: probe.wall, crate: probe.crate, gate: probe.gate,
              holes: holes.map(function (h) {
                return { id: h.id, color: h.color, c: h.c, r: h.r, index: h.index,
                         mouths: h.mouths.filter(function (m) { return !trialWall[m] && !trialCrate[m]; }),
                         facing: h.facing };
              }),
              creatures: probe.creatures
            };
            var chk = solveLevel(probeLevel, { nodeCap: 90000, fastOnly: true });

          } catch (e) { ok = false; }

        } else {

        }

      }
    }

    // ---- 7. gates on cells only ever traversed by ONE colour
    var gateCands = [];
    for (var gk in tl.traversedBy) {
      var cell = gk | 0;
      if (wall[cell] || crate[cell]) continue;
      var colorsHere = Object.keys(tl.traversedBy[gk]);
      if (colorsHere.length !== 1) continue;
      gateCands.push({ cell: cell, color: colorsHere[0] | 0 });
    }
    shuffleInPlace(gateCands, rng);
    var gatesPlaced = 0;
    for (var g2 = 0; g2 < gateCands.length && gatesPlaced < cfg.gates; g2++) {
      var gc = gateCands[g2];
      var isMouth = false;
      for (var hh = 0; hh < holes.length; hh++) {
        if (holes[hh].mouths.indexOf(gc.cell) >= 0) { isMouth = true; break; }
      }
      if (isMouth) continue;
      gate[gc.cell] = gc.color + 1;
      gatesPlaced++;
    }

    var budgets = tl.iceBudget(creatures.map(function (c) { return c.id; }));
    var iceOrder = creatures.map(function (c, i) { return { i: i, budget: budgets[c.id] || 0 }; })
      .filter(function (o) { return o.budget >= 1; })
      .sort(function (x, y) { return y.budget - x.budget; });
    for (var ic = 0; ic < iceOrder.length && ic < cfg.iceCreatures; ic++) {
      creatures[iceOrder[ic].i].ice = Math.min(4, iceOrder[ic].budget);
    }

    // ---- 9. assemble (renumber creatures 0..N-1 in placement order)
    var level = {
      level: cfg.level, tier: cfg.tier,
      cols: cols, rows: rows,
      region: Array.prototype.slice.call(reg),
      wall: Array.prototype.slice.call(wall),
      crate: Array.prototype.slice.call(crate),
      gate: Array.prototype.slice.call(gate),
      holes: holes,
      creatures: [],
      timeLimit: 120, parMoves: 0, seed: cfg.seed,
      buildOrder: null

    var remap = {};
    creatures.forEach(function (c, i) {
      remap[c.id] = i;
      level.creatures.push({ id: i, color: c.color, holeId: c.holeId, cells: c.cells.slice(), ice: c.ice || 0 });
    });
    level.buildOrder = {
      forward: tl.forwardPlan().map(function (act) {
        return { kind: act.kind, id: remap[act.id], count: act.count, target: act.target };
      }),
      repositions: repositionsMade
    };

    try { new Game(level); } catch (e) { return null; }
    return level;
  }

  /**
   * Deterministic per-level generation with GENERATE-MEASURE-REJECT: candidates
   * whose MEASURED difficulty falls outside the band for this level number are
   * discarded; the closest near-miss is kept only as a last resort.
   */
  function generateLevel(levelNumber, opts) {
    opts = opts || {};
    var cfg = levelConfig(levelNumber);
    var band = cfg.band;
    var maxAttempts = opts.maxAttempts || 34;
    var salt = ((opts.variant || 0) * 0x85EBCA6B) >>> 0;
    var best = null, bestDist = Infinity, inBand = null;
    var deadline = Date.now() + (opts.timeBudgetMs || 900);
    var analyzeOpts = {
      nodeCap: opts.nodeCap || 250000,
      orderCap: opts.orderCap || 24,
      repositionBudget: cfg.repositionEpisodes > 0 ? 2 : 1,
      timeBudgetMs: 900
    };

    var work = cfg;
    for (var a = 0; a < maxAttempts; a++) {
      // relaxation ladder: if nothing at all fits, ask for a little less
      if (a > 0 && a % 8 === 0 && !best) {
        work = Object.assign({}, work, {
          creatureCount: Math.max(3, work.creatureCount - 1),
          targetFree: Math.min(0.5, work.targetFree + 0.03),
          maxK: Math.max(3, work.maxK - 1)
        });
      }
      // never stall the UI: once the wall-clock budget is spent, ship the best
      // candidate found so far (it is always solvable - it was measured)
      if ((best || inBand) && Date.now() > deadline) break;
      var rng = makeRng((cfg.seed + salt + a * 0x9E3779B1) >>> 0);
      var lvl = null;
      try { lvl = tryGenerate(work, rng); } catch (e) { lvl = null; }
      if (!lvl) continue;

      // Cheap static gate before paying for a full solve: most rejects are
      // simply not packed tightly enough.
      if (a < maxAttempts - 6) {
        var pn = lvl.cols * lvl.rows, pPlay = 0, pOcc = 0;
        for (var pi = 0; pi < pn; pi++) {
          if (lvl.region[pi] && !lvl.wall[pi] && !lvl.crate[pi]) pPlay++;
        }
        lvl.creatures.forEach(function (c) { pOcc += c.cells.length; });
        var pFree = pPlay > 0 ? (pPlay - pOcc) / pPlay : 1;
        if (pFree > work.targetFree + (work.tier >= 3 ? 0.07 : 0.13)) continue;
        if (lvl.creatures.length < Math.max(3, work.creatureCount - 2)) continue;
      }

      var diff;
      try { diff = analyzeLevel(lvl, analyzeOpts); } catch (e) { continue; }
      if (!diff.solvable) continue;

      lvl.difficulty = diff;
      lvl.parMoves = diff.solutionLength;
      lvl.timeLimit = Math.round(clamp(55 + diff.solutionLength * 1.7, 90, 300));
      lvl.attempts = a + 1;

      if (diff.score >= band.min && diff.score <= band.max) {
        var rich = diff.maneuverDepth > 0 || diff.orderCount <= 6;
        if (rich || work.tier < 3 || inBand) return lvl;
        // in band but shallow: remember it and spend a few more attempts
        // looking for one that genuinely forces an ordering
        inBand = lvl;
        continue;
      }
      var dist = diff.score < band.min ? band.min - diff.score : diff.score - band.max;
      if (dist < bestDist) { bestDist = dist; best = lvl; }
    }
    if (inBand) return inBand;
    if (best) return best;
    // last resort: a guaranteed-simple board so the game can never dead-end
    var fallback = levelConfig(Math.min(4, levelNumber));
    fallback.level = levelNumber;
    fallback.seed = cfg.seed;
    for (var f = 0; f < 60; f++) {
      var lv2 = null;
      try { lv2 = tryGenerate(fallback, makeRng((cfg.seed + salt + f * 0x7F4A7C15) >>> 0)); } catch (e) { lv2 = null; }
      if (!lv2) continue;
      var d2 = analyzeLevel(lv2, { nodeCap: 250000, skipOrderCount: true, repositionBudget: 1 });
      if (!d2.solvable) continue;
      lv2.difficulty = d2;
      lv2.parMoves = d2.solutionLength;
      lv2.timeLimit = Math.round(clamp(55 + d2.solutionLength * 1.7, 90, 300));
      lv2.attempts = maxAttempts + f + 1;
      lv2.fallback = true;
      return lv2;
    }
    throw new Error('level generation failed for level ' + levelNumber);
  }

  // ----------------------------------------------------------------- scoring

  /** Stars key off move efficiency against the solver's optimal solution. */
  function starsFor(timeLeft, timeLimit, moves, parMoves) {
    var timeFrac = timeLimit > 0 ? clamp(timeLeft / timeLimit, 0, 1) : 0;
    var moveFrac = parMoves > 0 ? moves / parMoves : 1;
    if (timeFrac >= 0.35 && moveFrac <= 1.40) return 3;
    if (timeFrac >= 0.12 && moveFrac <= 2.30) return 2;
    return 1;
  }
  function coinsFor(stars, level, comboBest) {
    return Math.round((stars * 12 + 6) * (1 + Math.min(0.6, (level - 1) * 0.012)) + (comboBest || 0) * 5);
  }

  // --------------------------------------------------------------- utilities

  /** Replay a solver result on a fresh Game to prove the plan really works. */
  function replaySolution(level, solution) {
    var g = new Game(level);
    function feedOut(id) {
      var hd = holeDirFromHead(g, id);
      if (hd < 0) return 'creature ' + id + ' did not finish on a mouth';
      var guard = 0;
      while (!g.creatures[id].exited) {
        var fr = g.stepHead(id, hd);
        if (!fr.ok) return 'feed rejected for creature ' + id + ': ' + fr.reason;
        if (++guard > 64) return 'feed did not terminate for creature ' + id;
      }

    }

        var act = solution.actions[i];
        for (var p = 0; p < act.path.length; p++) {
          var r = g.stepHead(act.id, act.path[p]);
          if (!r.ok) return { ok: false, reason: act.kind + ' rejected for creature ' + act.id + ' step ' + p + ': ' + r.reason };
        }
        if (act.kind === 'exit') {
          var err = feedOut(act.id);
          if (err) return { ok: false, reason: err };
        }
      }
    } else if (solution.order) {
      for (var o = 0; o < solution.order.length; o++) {
        var id = solution.order[o];
        var path = solution.plans[id];
        for (var q = 0; q < path.length; q++) {
          var r2 = g.stepHead(id, path[q]);
          if (!r2.ok) return { ok: false, reason: 'move rejected for creature ' + id + ' step ' + q + ': ' + r2.reason };
        }
        var err2 = feedOut(id);
        if (err2) return { ok: false, reason: err2 };
      }
    } else {
      return { ok: false, reason: 'solution has neither actions nor an order' };
    }
    return { ok: g.isWon(), reason: g.isWon() ? 'won' : 'not all creatures exited', game: g };
  }

  /** Replay the GENERATOR's own construction record (diagnostics only). */
  function replayConstruction(level) {
    if (!level.buildOrder || !level.buildOrder.forward) return { ok: false, reason: 'no build record' };
    var g = new Game(level);
    var fwd = level.buildOrder.forward;
    for (var i = 0; i < fwd.length; i++) {
      var a = fwd[i];
      if (a.kind === 'move') {
        var head = g.creatures[a.id].cells[0];
        var dir = -1;
        for (var d = 0; d < 4; d++) {
          if (g.colOf(head) + DIRS[d].dc === g.colOf(a.target) &&
              g.rowOf(head) + DIRS[d].dr === g.rowOf(a.target)) { dir = d; break; }
        }
        if (dir < 0) return { ok: false, reason: 'construction move ' + i + ' not adjacent for creature ' + a.id };
        var r = g.stepHead(a.id, dir);
        if (!r.ok) return { ok: false, reason: 'construction move ' + i + ' rejected: ' + r.reason };
      } else {
        var hd = holeDirFromHead(g, a.id);
        if (hd < 0) return { ok: false, reason: 'construction feed ' + i + ': creature ' + a.id + ' not on a mouth' };
        for (var k = 0; k < a.count; k++) {
          var fr = g.stepHead(a.id, hd);
          if (!fr.ok) return { ok: false, reason: 'construction feed ' + i + ' rejected: ' + fr.reason };
        }
      }
    }
    return { ok: g.isWon(), reason: g.isWon() ? 'won' : 'construction did not clear the board', game: g };
  }

  /** ASCII dump - debugging aid and test failure output. */
  function render(game) {
    var out = [];
    for (var r = 0; r < game.rows; r++) {
      var line = '';
      for (var c = 0; c < game.cols; c++) {
        var i = game.idx(c, r);
        var hid = game.holeAt[i];
        if (hid >= 0) { line += String.fromCharCode(48 + game.holes[hid].color); continue; }
        if (!game.region[i]) { line += ' '; continue; }
        if (game.wall[i]) { line += '#'; continue; }
        if (game.crate[i]) { line += 'X'; continue; }
        var o = game.occ[i];
        if (o < 0) { line += game.gate[i] ? '=' : '.'; continue; }
        line += (game.creatures[o].cells[0] === i)
          ? String.fromCharCode(65 + o) : String.fromCharCode(97 + o);
      }
      out.push(line);
    }
    return out.join('\n');
  }

  return {
    VERSION: VERSION,
    DIRS: DIRS,
    DIR_UP: DIR_UP, DIR_RIGHT: DIR_RIGHT, DIR_DOWN: DIR_DOWN, DIR_LEFT: DIR_LEFT,
    OPPOSITE: OPPOSITE,
    COLOR_COUNT: COLOR_COUNT,
    TIER_COUNT: TIER_COUNT,
    makeRng: makeRng,
    buildLevel: buildLevel,
    Game: Game,
    levelConfig: levelConfig,
    tierOf: tierOf,
    difficultyBand: difficultyBand,
    difficultyLabel: difficultyLabel,
    generateLevel: generateLevel,
    analyzeLevel: analyzeLevel,
    solveLevel: solveLevel,
    solverContext: solverContext,
    countExitOrders: countExitOrders,
    snakeSearch: snakeSearch,
    reachableConfigs: reachableConfigs,
    findExitPath: findExitPath,
    findHint: findHint,
    holeDirFromHead: holeDirFromHead,
    replaySolution: replaySolution,
    replayConstruction: replayConstruction,
    starsFor: starsFor,
    coinsFor: coinsFor,
    render: render
  };
});
