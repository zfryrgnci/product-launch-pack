name: Build all games

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        game: [spacebala, neonsnake, quantumascent, neonblocks, neonunravel]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
      - name: Prepare signing
        run: |
          cp "$GITHUB_WORKSPACE/upload-keystore.jks" upload-keystore.jks
          cat > keystore.properties <<'PROPS'
          storeFile=../upload-keystore.jks
          storePassword=TA6Rq0Jkp5xRqMV1z2tnSj9N
          keyAlias=upload
          keyPassword=TA6Rq0Jkp5xRqMV1z2tnSj9N
          PROPS
      - name: Build signed release AAB
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.game }}-RELEASE-signed
          path: ${{ matrix.game }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  collect:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: _artifacts }
      - name: Gather AABs into releases/
        run: |
          mkdir -p releases
          for aab in $(find _artifacts -name '*.aab'); do
            game=$(echo "$aab" | sed -E 's#.*/([a-z]+)/app/build/.*#\1#')
            mkdir -p "releases/$game"
            cp "$aab" "releases/$game/app-release.aab"
          done
          ls -R releases || true
      - name: Commit AABs back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f releases
          git commit -m "Publish signed game AABs to releases/ [skip ci]" || echo "nothing to commit"
          git push
